- type: entity
  id: BaseAspect
  parent: BaseGameRule
  abstract: true
  components:
  - type: Aspect

- type: entity
  id: LandmineAspect
  parent: BaseAspect
  name: entity-landmineaspect-name
  description: entity-landmineaspect-description
  categories: [ HideSpawnMenu ]
  components:
    - type: Aspect
      startAudio:
        path: /Audio/_White/Aspects/accent.ogg
    - type: SpawnAspect
      prototype: LandMineExplosive
      max: 60
      min: 40

- type: entity
  id: TraitoredAspect
  parent: BaseAspect
  name: entity-traitoredaspect-name
  description: entity-traitoredaspect-description
  categories: [ HideSpawnMenu ]
  components:
    - type: Aspect
      requires: "Traitors"
      hidden: true
    - type: TraitoredAspect

- type: entity
  id: PresentAspect
  parent: BaseAspect
  name: entity-presentaspect-name
  description: entity-presentaspect-description
  categories: [ HideSpawnMenu ]
  components:
    - type: Aspect
      weight: 2
      startAudio:
        path: /Audio/_White/Aspects/accent.ogg
    - type: SpawnAspect
      prototype: PresentRandomUnsafe

- type: entity
  id: ReflectAspect
  parent: BaseAspect
  name: entity-reflectaspect-name
  description: entity-reflectaspect-description
  categories: [ HideSpawnMenu ]
  components:
    - type: Aspect
      weight: 2
      startAudio:
        path: /Audio/_White/Aspects/accent.ogg
    - type: ReflectAspect

- type: entity
  id: NothingAspect
  parent: BaseAspect
  name: entity-nothingaspect-name
  description: entity-nothingaspect-description
  categories: [ HideSpawnMenu ]
  components:
    - type: Aspect
      weight: 3
      forbidden: true
      hidden: true
    - type: NothingAspect

- type: entity
  id: RichTraitorAspect
  parent: BaseAspect
  name: entity-richtraitoraspect-name
  description: entity-richtraitoraspect-description
  categories: [ HideSpawnMenu ]
  components:
    - type: Aspect
      requires: "Traitors"
      weight: 2
      hidden: true
    - type: RichTraitorAspect

- type: entity
  id: ImmersiveAspect
  parent: BaseAspect
  name: entity-immersiveaspect-name
  description: entity-immersiveaspect-description
  categories: [ HideSpawnMenu ]
  components:
  - type: Aspect
    weight: 3
    startAudio:
      path: /Audio/_White/Aspects/accent.ogg
  - type: ImmersiveAspect
