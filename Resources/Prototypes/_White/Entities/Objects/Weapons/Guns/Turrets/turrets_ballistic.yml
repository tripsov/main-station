- type: entity
  parent: [BaseWeaponTurretNoHTR, ConstructibleMachine]
  id: WeaponTurretModular
  name: entity-weaponturretmodular-name
  description: entity-weaponturretmodular-description
  suffix: Remote controlled
  components:
  - type: Sprite
    granularLayersRendering: true
    layers:
    - state: syndie_base
      renderingStrategy: NoRotation
    - map: [ "weapon" ]
      renderingStrategy: Default
      rotation: -90
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      weapon_slot: !type:ContainerSlot
  - type: GunSlot
    slot: weapon_slot
  - type: ItemSlots
    slots:
      weapon_slot:
        ejectOnInteract: false
        ejectOnBreak: true
        swap: false
        name: weapon-slot
        priority: 1
        whitelist:
          components:
          - Gun
  - type: ItemSlotRenderer
    mapping:
      weapon_slot: weapon
  - type: RemoteControlTarget
    canManually: true
  - type: RemoteControlOverlay
  - type: Machine
    board: WeaponTurretModularCircuitBoard
  - type: Lock
    locked: false
    lockTime: 3
    unlockTime: 10
  - type: ItemSlotsLock
    slots:
    - weapon_slot
  - type: GunSignalControl
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: DeviceLinkSink
    ports:
    - RemoteControlOutputPort
  - type: WiredNetworkConnection
