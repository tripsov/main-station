- type: entity
  name: entity-paperwrittencommunist-name
  description: entity-paperwrittencommunist-description
  id: PaperWrittenCommunist
  parent: Paper
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper
      color: "#e6e6fa"
    - state: paper_words
      map: [ "enum.PaperVisualLayers.Writing" ]
      color: "#e6e6fa"
      visible: true
  - type: Tag
    tags:
    - PaperWrittenCommunist
  - type: Construction
    graph: RevolutionaryManifestoGraph
    node: communistpaper

- type: entity
  name: entity-ungluedcardboard-name
  description: entity-ungluedcardboard-description
  id: UngluedCardboard
  parent: Paper
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 3
  - type: InjectableSolution
    solution: drink
  - type: RefillableSolution
    solution: drink
  - type: Construction
    graph: PaperGraph
    node: ungluedCardboard
