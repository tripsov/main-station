- type: entity
  parent: BodyBag
  id: BodyBagBluespace
  name: entity-bodybagbluespace-name
  description: entity-bodybagbluespace-description
  components:
  - type: Sprite
    sprite: _White/Objects/Specific/Medical/BodyBags/bluespace.rsi
    layers:
    - state: bluespacebag
      map: ["unfoldedLayer", "enum.StorageVisualLayers.Base"]
    - state: bluespacebag_folded
      map: ["foldedLayer"]
      visible: false
    - state: open_overlay
      map: ["enum.StorageVisualLayers.Door"]
  - type: Icon
    sprite: _White/Objects/Specific/Medical/BodyBags/bluespace.rsi
    state: bluespacebag
  - type: EntityStorage
    capacity: 50

- type: entity
  parent: BodyBagBluespace
  id: BodyBagBluespaceFolded
  suffix: Folded
  components:
  - type: Foldable
    folded: true

