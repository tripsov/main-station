- type: entity
  id: ActionAIToggleBolts
  name: entity-actionaitogglebolts-name
  description: entity-actionaitogglebolts-description
  components:
  - type: InstantAction
    priority: -1
    itemIconStyle: NoItem
    icon:
      sprite: _White/Interface/Actions/actions_ai.rsi
      state: toggle_bolts
    event: !type:AiToggleBoltsEvent
    useDelay: 0.5

- type: entity
  id: ActionAICameraList
  name: entity-actionaicameralist-name
  description: entity-actionaicameralist-description
  components:
  - type: InstantAction
    priority: -5
    itemIconStyle: NoItem
    icon:
      sprite: _White/Interface/Actions/actions_ai.rsi
      state: camera
    event: !type:AiCameraListEvent
    useDelay: 0.5

- type: entity
  id: ActionBackToAi
  name: entity-actionbacktoai-name
  description: entity-actionbacktoai-description
  components:
  - type: InstantAction
    checkConsciousness: false
    checkCanInteract: false
    priority: -9
    itemIconStyle: BigAction
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: ai_core
    event: !type:ReturnMindIntoAiEvent

- type: entity
  id: ActionOpenRemoteDevicesMenu
  name: entity-actionopenremotedevicesmenu-name
  description: entity-actionopenremotedevicesmenu-description
  components:
  - type: InstantAction
    checkConsciousness: false
    checkCanInteract: false
    priority: -9
    itemIconStyle: BigAction
    event: !type:ToggleRemoteDevicesScreenEvent
    icon:
      sprite: Mobs/Silicon/chassis.rsi
      state: robot
