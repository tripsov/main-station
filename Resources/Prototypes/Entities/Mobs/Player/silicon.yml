# Be careful with these as they get removed on shutdown too!
- type: entity
  id: AiHeld
  description: entity-aiheld-description
  categories: [ HideSpawnMenu ]
  components:
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
    - Common
    - Command
    - Engineering
    - Medical
    - Science
    - Security
    - Prison
    - Service
    - Supply
    - Justice
  - type: ActiveRadio
    channels:
    - Binary
    - Common
    - Command
    - Engineering
    - Medical
    - Science
    - Security
    - Prison
    - Service
    - Supply
    - Justice
  - type: IgnoreUIRange
  - type: StationAiHeld
  - type: StationAiOverlay
  - type: ShowElectrocutionHUD
  - type: ActionGrant
    actions:
    - ActionJumpToCore
    - ActionShowJobIcons
    - ActionSurvCameraLights
    - ActionAIViewLaws
    - ActionOpenRemoteDevicesMenu # WD edit - AiRemoteControl
    - ActionAIToggleBolts # WD edit
    - ActionAICameraList # WD edit
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
      enum.CrewMonitoringUIKey.Key:
        type: CrewMonitoringBoundUserInterface
      enum.GeneralStationRecordConsoleKey.Key:
        type: GeneralStationRecordConsoleBoundUserInterface
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
      enum.CommunicationsConsoleUiKey.Key:
        type: CommunicationsConsoleBoundUserInterface
      enum.RemoteDeviceUiKey.Key: # WD edit - AiRemoteControl
        type: RemoteDevicesBoundUserInterface
      enum.ListViewSelectorUiKey.Key: # WD edit
        type: ListViewSelectorBUI
  - type: IntrinsicUI
    uis:
      enum.RadarConsoleUiKey.Key:
        toggleAction: ActionAGhostShowRadar
      enum.CrewMonitoringUIKey.Key:
        toggleAction: ActionAGhostShowCrewMonitoring
      enum.GeneralStationRecordConsoleKey.Key:
        toggleAction: ActionAGhostShowStationRecords
      enum.CommunicationsConsoleUiKey.Key:
        toggleAction: ActionAGhostShowCommunications
  - type: CrewMonitoringConsole
  - type: GeneralStationRecordConsole
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: CrewMonitor
    transmitFrequencyId: ShuttleTimer
  - type: RadarConsole
    followEntity: false
  - type: CommunicationsConsole
    canShuttle: false
    title: comms-console-announcement-title-station-ai
    color: "#5ed7aa"
  - type: HolographicAvatar
    layerData:
    - sprite: Mobs/Silicon/station_ai.rsi
      state: default
  - type: ShowJobIcons
  # WD EDIT START
  - type: BlockMovement
    blockInteraction: false
  - type: SiliconLawProvider
    laws: Asimov
  - type: SiliconLawBound
  - type: ComplexInteraction
  - type: Eye
    drawFov: false
  - type: InputMover
  - type: IonStormTarget
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
  - type: Access
    groups:
    - AllAccess
    - Silicon
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - SolCommon
    - Tradeband
    - Freespeak
    - Elyran
    - RobotTalk
    understands:
    - TauCetiBasic
    - SolCommon
    - Tradeband
    - Freespeak
    - Elyran
    - RobotTalk
    - Sign
  - type: LanguageSpeaker
    spokenLanguages:
    - TauCetiBasic
    - SolCommon
    - Tradeband
    - Freespeak
    - Elyran
    - RobotTalk
    understoodLanguages:
    - TauCetiBasic
    - SolCommon
    - Tradeband
    - Freespeak
    - Elyran
    - RobotTalk
    - Sign
  - type: EmagSiliconLaw
    unRemovable: true
  # WD EDIT END

- type: entity
  id: AiHeldIntellicard
  description: entity-aiheldintellicard-description
  categories: [ HideSpawnMenu ]
  components:
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
  - type: ActiveRadio
    channels:
    - Binary
    - Common
  - type: ActionGrant
    actions:
    - ActionAIViewLaws
  - type: UserInterface
    interfaces:
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface

# Ai
- type: entity
  id: AiHolder
  abstract: true
  description: entity-aiholder-description
  components:
  - type: ItemSlots
  - type: StationAiHolder
    slot:
      name: station-ai-mind-slot
      locked: false
      disableEject: true
      whitelist:
        # WD EDiT START
        components:
        - BorgBrain
        # WD EDIT END
  - type: ContainerContainer
    containers:
      station_ai_mind_slot: !type:ContainerSlot
        # Load-bearing.
        # The issue is verbs check for same transparent container.
        # The alternative is you add a bunch of events trying to override it; we don't even really need the container functionality
        # anyway it's just a quality of life thing.
        showEnts: True

