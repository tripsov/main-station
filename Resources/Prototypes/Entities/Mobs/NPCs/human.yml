  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: Damageable
    damage:
      types:
        Bloodloss: 49
        Asphyxiation: 76
        Slash: 56
        Blunt: 19
        Radiation: 1984 # DV: Unrevivable due to prolonged exposure to space.
  - type: Inventory
    templateId: corpse

