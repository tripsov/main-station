- type: entity
  name: entity-trayscanner-name
  parent: BaseItem
  id: trayScanner
  description: entity-trayscanner-description
  components:
  - type: Sprite
    sprite: Objects/Tools/t-ray.rsi
    layers:
    - state: tray-off
      map: ["base"]
  - type: TrayScanner
  - type: Item
    sprite: Objects/Tools/t-ray.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TrayScannerVisual.Visual:
        base:
          On: { state: tray-on }
          Off: { state: tray-off }
  - type: PhysicalComposition
    materialComposition:
      Aluminum: 300
      Glass: 100
      Circuitry: 25
  - type: StaticPrice
    price: 60
