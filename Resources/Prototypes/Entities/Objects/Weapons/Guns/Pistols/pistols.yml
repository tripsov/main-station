- type: entity
  name: entity-baseweaponpistol-name
  parent: BaseItem
  id: BaseWeaponPistol
  description: entity-baseweaponpistol-description
  abstract: true
  components:
  - type: Sprite
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Tag
    tags:
    - Sidearm
  - type: Clothing
    equipSound: /Audio/_White/Equip/clothingrustle2.ogg # WWDP
    sprite: Objects/Weapons/Guns/Pistols/viper.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Gun
    bonusAngleIncreaseMove: 20    # wwdp
    bonusAngleIncreaseTurn: 0.4   # wwdp
    bonusAngleDecay: 80           # wwdp
    maxBonusAngle: 10             # wwdp
    fireRate: 6
    defaultDirection: 1, 0 # wwdp
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/pistol_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistol
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistol
      gun_chamber:
        name: Chamber
        startingItem: CartridgePistol
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: Execution
  # - type: AmmoCounter # WWDP
  - type: MeleeWeapon
    attackRate: 1.2
    damage:
      types:
        Blunt: 7.5
    swapKeys: true
    disableHeavy: true
    animation: WeaponArcThrust
    wideAnimationRotation: 135
    soundHit:
      collection: MetalThud
  - type: DamageOtherOnHit
    staminaCost: 5
  - type: EmitSoundOnPickup # WWDP sounds
    sound:
      collection: PistolsPickUp
  - type: EmitSoundOnDrop # WWDP sounds
    sound:
      collection: PistolsDrop
  - type: EmitSoundOnLand # WWDP sounds
    sound:
      collection: PistolsDrop
  - type: DisarmMalus # WWDP
    malus: 0.3

