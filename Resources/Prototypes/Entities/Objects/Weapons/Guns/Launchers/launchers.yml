- type: entity
  name: entity-baseweaponlauncher-name
  parent: BaseItem
  id: BaseWeaponLauncher
  description: entity-baseweaponlauncher-description
  abstract: true
  components:
  - type: Sprite
  - type: Clothing
    sprite: Objects/Weapons/Guns/Launchers/china_lake.rsi
    quickEquip: false
    slots:
    - Back
  - type: Item
    size: Huge
  - type: StaticPrice
    price: 500
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: Gun
    bonusAngleIncreaseMove: 60    # wwdp
    bonusAngleIncreaseTurn: 0.75   # wwdp
    bonusAngleDecay: 35           # wwdp
    maxBonusAngle: 30             # wwdp
    defaultDirection: 1, 0 # wwdp
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Blunt: 14
    bluntStaminaDamageFactor: 1.5
    swapKeys: true
    disableHeavy: true
    animation: WeaponArcThrust
    wideAnimationRotation: 180
    soundHit:
      collection: MetalThud
  - type: DamageOtherOnHit
    staminaCost: 14
  - type: Execution

- type: entity
  name: entity-weaponlauncherchinalake-name
  parent: [BaseWeaponLauncher, BaseGunWieldable]
  id: WeaponLauncherChinaLake
  description: entity-weaponlauncherchinalake-description
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/china_lake.rsi
    layers:
      - state: icon
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Launchers/china_lake.rsi
    slots:
    - Back
    - suitStorage
  # - type: AmmoCounter # WWDP
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - Grenade
    capacity: 3
    autoCycle: false
    proto: GrenadeFrag
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: Item # WWDP guns resize
    shape:
    - 0,0,5,1

- type: entity
  name: entity-weaponlauncherrocket-name
  parent: BaseWeaponLauncher
  id: WeaponLauncherRocket
  description: entity-weaponlauncherrocket-description
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/rocket.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    equipSound: /Audio/_White/Equip/clothingrustle4.ogg # WWDP
    sprite: Objects/Weapons/Guns/Launchers/rocket.rsi
  - type: Gun
    fireRate: 0.5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rpgfire.ogg
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeRocket
    proto: CartridgeRocket
    capacity: 1
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
    autoCycle: true # WD EDIT # WWDP edit
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: EmitSoundOnPickup # WWDP sounds
    sound:
      collection: RiflesPickUp
  - type: EmitSoundOnDrop # WWDP sounds
    sound:
      collection: RiflesDrop
  - type: EmitSoundOnLand # WWDP sounds
    sound:
      collection: RiflesDrop
  - type: Item # WWDP guns resize
    shape:
    - 0,0,7,1

- type: entity
  name: entity-weaponlaunchermultiplerocket-name
  parent: BaseWeaponLauncher
  id: WeaponLauncherMultipleRocket
  description: entity-weaponlauncherrocket-description
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/rocket.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Launchers/rocket.rsi
  - type: Gun
    fireRate: 6
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rpgfire.ogg
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeRocket
    proto: CartridgeRocketSlow
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Item # WWDP guns resize
    shape:
    - 0,0,7,2

- type: entity
  name: entity-weaponlauncherpiratecannon-name
  parent: BaseWeaponLauncher
  id: WeaponLauncherPirateCannon
  description: entity-weaponlauncherpiratecannon-description
  components:
    - type: Sprite
      sprite: Objects/Weapons/Guns/Launchers/pirate_cannon.rsi
      layers:
        - state: icon
          map: ["enum.GunVisualLayers.Base"]
    - containers:
        balistic-ammo: !type:Container
          ents: []
        ballistic-ammo: !type:Container
          ents: []
      type: ContainerContainer
    - type: Clothing
      sprite: Objects/Weapons/Guns/Launchers/pirate_cannon.rsi
    - type: Gun
      fireRate: 1
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
    - type: BallisticAmmoProvider
      whitelist:
        tags:
          - CannonBall
      capacity: 1
      proto: CannonBall
      soundInsert:
        path: /Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg
    - type: Item # WWDP guns resize
      shape:
      - 0,0,5,1

