- type: entity
  parent: BaseItem
  id: BaseAmmoProvider
  abstract: true
  components:
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Storage/boxes.rsi

- type: entity
  parent: BaseAmmoProvider
  id: AmmoProviderShotgunShell
  abstract: true
  components:
    - type: BallisticAmmoProvider
      soundInsert:
        path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg # WWDP
      mayTransfer: true
      whitelist:
        tags:
        - ShellShotgun
      capacity: 16

# Shotgun Shells
- type: entity
  name: entity-boxbeanbag-name
  parent: AmmoProviderShotgunShell
  id: BoxBeanbag
  description: entity-boxbeanbag-description
  components:
    - type: BallisticAmmoProvider
      proto: ShellShotgunBeanbag
    - type: Sprite
      layers:
        - state: boxwide
        - state: shellbeanbag

