- type: entity
  id: BaseWeaponBattery
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Huge
  - type: Clothing
    equipSound: /Audio/_White/Equip/clothingrustle4.ogg # WWDP
    sprite: Objects/Weapons/Guns/Battery/laser_retro.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: DisarmMalus # WWDP
    malus: 0.3
    wieldedBonus: 0.3
  - type: Gun
    fireRate: 2
    defaultDirection: 1, 0 # wwdp
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireOnDropChance: 0.15
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: MeleeWeapon
    attackRate: 1.3333
    damage:
      types:
        Blunt: 8.5
    bluntStaminaDamageFactor: 1.25
    swapKeys: true
    disableHeavy: true
    animation: WeaponArcThrust
    wideAnimationRotation: 180
    soundHit:
      collection: MetalThud
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 2.5
  - type: DamageOtherOnHit
    staminaCost: 7
  - type: EmitSoundOnPickup # WWDP sounds
    sound:
      collection: LasersPickUp
  - type: EmitSoundOnDrop # WWDP sounds
    sound:
      collection: LasersDrop
  - type: EmitSoundOnLand # WWDP sounds
    sound:
      collection: LasersDrop
  # Shitmed Change
  - type: Cautery
    speed: 0.9
  - type: SurgeryTool
    endSound:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg

# WWDP prototype
- type: entity
  id: BaseWeaponOverheat
  abstract: True
  components:
  - type: Temperature
  - type: AtmosExposed
  - type: GunOverheat # wwdp
    temperatureLimit: 150

# WWDP prototype
- type: entity
  id: BaseWeaponOverheatLamp
  parent: [BaseWeaponOverheat, BaseWeaponOverheatLampSlot]
  abstract: True
  components:
  - type: GunOverheat # wwdp
    requiresLamp: true
    canChangeSafety: true
    temperatureLimit: 240

# WWDP prototype
- type: entity
  id: BaseWeaponOverheatLampSlot
  parent: BaseWeaponOverheat
  abstract: True
  components:
  - type: ContainerContainer
    containers:
      gun-regulator-lamp-slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      gun-regulator-lamp-slot:
        name: Regulator Lamp
        swap: false
        priority: 20
        startingItem: BasicRegulatorLamp
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          components:
            - RegulatorLamp

- type: entity
