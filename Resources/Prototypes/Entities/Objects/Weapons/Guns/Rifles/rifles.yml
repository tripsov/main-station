- type: entity
  name: entity-baseweaponrifle-name
  parent: [BaseItem, BaseGunWieldable]
  id: BaseWeaponRifle
  description: entity-baseweaponrifle-description
  abstract: true
  components:
  - type: Sprite
  - type: Item # WWDP guns resize
    size: Huge
    shape:
    - 0,0,7,1
  - type: Clothing
    equipSound: /Audio/_White/Equip/clothingrustle4.ogg # WWDP
    sprite: Objects/Weapons/Guns/Rifles/ak.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Wieldable
  # - type: AmmoCounter # WWDP
  - type: Gun
    bonusAngleIncreaseMove: 40    # wwdp
    bonusAngleIncreaseTurn: 0.25  # wwdp
    bonusAngleDecay: 40           # wwdp
    maxBonusAngle: 20             # wwdp
    fireRate: 5
    defaultDirection: 1, 0 # wwdp
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/batrifle.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifle
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 500
  - type: Execution
  - type: MeleeWeapon
    attackRate: 1.3333
    damage:
      types:
        Blunt: 8.5
    bluntStaminaDamageFactor: 1.25
    swapKeys: true
    disableHeavy: true
    animation: WeaponArcThrust
    wideAnimationRotation: 180
    soundHit:
      collection: MetalThud
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 2.5
  - type: DamageOtherOnHit
    staminaCost: 7.5

- type: entity
  name: entity-weaponrifleak-name
  parent: BaseWeaponRifle
  id: WeaponRifleAk
  description: entity-weaponrifleak-description
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/ak.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
    fireOnDropChance: 0.5
  - type: ChamberMagazineAmmoProvider
    boltCatch: false # WWDP no zatvornaya zaderzhka kak u m-16
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: EmitSoundOnPickup # WWDP sounds
    sound:
      collection: RiflesPickUp
  - type: EmitSoundOnDrop # WWDP sounds
    sound:
      collection: RiflesDrop
  - type: EmitSoundOnLand # WWDP sounds
    sound:
      collection: RiflesDrop

