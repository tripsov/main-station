- type: entity
  name: entity-weaponriflefoam-name
  parent: [BaseWeaponShotgun, BaseGunWieldable]
  id: WeaponRifleFoam
  description: entity-weaponriflefoam-description
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/foam_rifle.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Rifles/foam_rifle.rsi
  - type: Item
    shape: # WWDP guns resize
    - 0,0,5,0 # Toy size
    sprite: Objects/Weapons/Guns/Rifles/foam_rifle_inhand_64x.rsi
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - BulletFoam
    capacity: 10
    proto: BulletFoam
  - type: GunRequiresWield #remove when inaccuracy on spreads is fixed
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Effects/thunk.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
    clumsyProof: true
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0 # Krillions must bubble-wrap the foam rifle
    soundHit:
      collection: ToySqueak
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 0
  - type: DamageOtherOnHit
    staminaCost: 3.5
