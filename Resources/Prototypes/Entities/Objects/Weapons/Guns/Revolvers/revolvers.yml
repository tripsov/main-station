- type: entity
  name: entity-baseweaponrevolver-name
  parent: BaseItem
  id: BaseWeaponRevolver
  description: entity-baseweaponrevolver-description
  abstract: true
  components:
  - type: Sprite
    state: icon
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Tag
    tags:
    - Sidearm
  - type: Clothing
    equipSound: /Audio/_White/Equip/clothingrustle2.ogg # WWDP
    sprite: Objects/Weapons/Guns/Revolvers/deckard.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: AmmoCounter
  - type: Gun
    bonusAngleIncreaseMove: 20    # wwdp
    bonusAngleIncreaseTurn: 0.4   # wwdp
    bonusAngleDecay: 45           # wwdp
    maxBonusAngle: 10             # wwdp
    selectedMode: SemiAuto
    fireRate: 1.5
    defaultDirection: 1, 0 # wwdp
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
    fireOnDropChance: 0.5
  - type: UseDelay
    delay: 0.66
  - type: DisarmMalus # WWDP
    malus: 0.3
  - type: ContainerContainer
    containers:
      revolver-ammo: !type:Container
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - CartridgeMagnum
        - SpeedLoaderMagnum
    proto: CartridgeMagnum
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]
    soundEject:
      path: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
  - type: StaticPrice
    price: 500
  - type: MeleeWeapon
    attackRate: 1.2
    damage:
      types:
        Blunt: 7
    swapKeys: true
    disableHeavy: true
    animation: WeaponArcThrust
    wideAnimationRotation: 135
    soundHit:
      collection: MetalThud
  - type: DamageOtherOnHit
    staminaCost: 5
  - type: EmitSoundOnPickup # WWDP sounds
    sound:
      collection: RevolversPickUp
  - type: EmitSoundOnDrop # WWDP sounds
    sound:
      collection: RevolversDrop
  - type: EmitSoundOnLand # WWDP sounds
    sound:
      collection: RevolversDrop

- type: entity
  name: entity-weaponrevolverdeckard-name
  parent: BaseWeaponRevolver
  id: WeaponRevolverDeckard
  description: entity-weaponrevolverdeckard-description
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/deckard.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-3
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Gun
    fireRate: 2
  - type: RevolverAmmoProvider
    capacity: 5
    chambers: [ True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null ]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 1500

- type: entity
  name: entity-weaponrevolverdeckard-name
  parent: WeaponRevolverDeckard
  id: WeaponRevolverDeckardSecurity
  description: entity-weaponrevolverdeckard-description
               The serial number on the handguard marks this gun as belonging to an NT Security Officer.
  components:
