- type: entity
  name: entity-fireaxe-name
  parent: BaseItem
  id: FireAxe
  description: entity-fireaxe-description
  components:
  - type: Tag
    tags:
    - FireAxe
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    sprite: Objects/Weapons/Melee/fireaxe.rsi
    state: icon
  - type: DisarmMalus # WWDP
    malus: 0.3
    wieldedBonus: 0.3
  - type: MeleeWeapon
    animationRotation: 45 # WWDP
    wideAnimationRotation: 135
    swingLeft: true
    attackRate: 1.25
    damage:
      types:
        # axes are kinda like sharp hammers, you know?
        Blunt: 4
        Slash: 6
        Structural: 10
    heavyDamageBaseModifier: 1.0
    heavyStaminaCost: 2.5
    angle: 100
    soundHit:
      collection: MetalThud
  - type: DamageOtherOnHit
    meleeDamageMultiplier: 1.5
    staminaCost: 10
  - type: EmbeddableProjectile
  - type: EmbedPassiveDamage
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 2.5 # WD EDIT
        Slash: 7.5 # WD EDIT
        Structural: 40
  - type: Item
    size: Ginormous
  - type: Clothing
    sprite: Objects/Weapons/Melee/fireaxe.rsi
    quickEquip: false
    slots:
    - back
  - type: Tool
    qualities:
      - Prying
      - AdvancedPrying # White Dream
  - type: ToolTileCompatible
  - type: Prying
  - type: UseDelay
    delay: 1
  - type: StealTarget
    stealGroup: FireAxe
  - type: IgniteOnMeleeHit
    fireStacks: -4
  # Shitmed Change
  - type: Scalpel
    speed: 0.3
  - type: BoneSaw
    speed: 0.5
  - type: SurgeryTool
    startSound:
      path: /Audio/Medical/Surgery/saw.ogg

- type: entity
  id: FireAxeFlaming
  name: entity-fireaxeflaming-name
  parent: FireAxe
  description: entity-fireaxeflaming-description
  components:
  - type: MeleeWeapon
    wideAnimationRotation: 90
    animationRotation: 0 # WWDP
  - type: IgniteOnMeleeHit
    fireStacks: 1
  - type: Sprite
    sprite: Objects/Weapons/Melee/fireaxeflaming.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Weapons/Melee/fireaxeflaming.rsi
    quickEquip: false
    slots:
    - back
