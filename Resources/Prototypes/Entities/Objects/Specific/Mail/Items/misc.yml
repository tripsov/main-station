# Mail-only items. If/when these get used for anything else, please move them to another folder.
# Pranks: admin items or effects put into an envelope, released when opened or damaged.
- type: entity
  id: DelayedSmoke
  parent: BaseItem
  categories: [ HideSpawnMenu ]
  name: entity-delayedsmoke-name
  suffix: "(10s)"
  components:
  - type: Sprite #DeltaV: Apparently these want sprites, probably because they're baseitems
    sprite: /Textures/Objects/Fun/goldbikehorn.rsi
    visible: false
    state: icon
  - type: DelayedItem
    item: AdminInstantEffectSmoke10

- type: entity
  id: AdminInstantEffectEMP7
  categories: [ HideSpawnMenu ]
  suffix: EMP, 7 meters
  parent: AdminInstantEffectBase
  components:
  - type: EmpOnTrigger
    range: 7
    energyConsumption: 50000

- type: entity
  id: DelayedEMP
  parent: BaseItem
  categories: [ HideSpawnMenu ]
  name: entity-delayedemp-name
  components:
  - type: Sprite #DeltaV: Apparently these want sprites, probably because they're baseitems
    sprite: /Textures/Objects/Fun/goldbikehorn.rsi
    visible: false
    state: icon
  - type: DelayedItem
    item: AdminInstantEffectEMP7

# Miscellaneous Items

- type: entity
  id: SyringeCognizine
  parent: Syringe
  name: entity-syringecognizine-name
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 15
        reagents:
        - ReagentId: Cognizine
          Quantity: 15 # Surely three friends is enough.

