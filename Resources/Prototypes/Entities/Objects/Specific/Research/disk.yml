- type: entity
  parent: BaseItem
  id: ResearchDisk
  name: entity-researchdisk-name
  description: entity-researchdisk-description
  components:
  - type: Sprite
    sprite: Objects/Specific/Research/researchdisk.rsi
    state: icon
  - type: ResearchDisk
  - type: GuideHelp
    guides:
    - Science
  - type: EmitSoundOnPickup
    sound: /Audio/SimpleStation14/Items/Handling/disk_pickup.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/SimpleStation14/Items/Handling/disk_drop.ogg
  - type: EmitSoundOnLand
    sound: /Audio/SimpleStation14/Items/Handling/disk_drop.ogg

- type: entity
  parent: ResearchDisk
  id: ResearchDisk5000
  name: entity-researchdisk5000-name
  description: entity-researchdisk5000-description
  components:
  - type: ResearchDisk
    points: 5000

- type: entity
  parent: ResearchDisk
  id: ResearchDisk10000
  name: entity-researchdisk10000-name
  description: entity-researchdisk10000-description
  components:
  - type: ResearchDisk
    points: 10000

- type: entity
  parent: ResearchDisk
  id: ResearchDisk20000
  name: entity-researchdisk20000-name
  description: entity-researchdisk20000-description
  components:
  - type: ResearchDisk
    points: 20000

- type: entity
  parent: ResearchDisk
  id: ResearchDisk50000
  name: entity-researchdisk50000-name
  description: entity-researchdisk50000-description
  components:
  - type: ResearchDisk
    points: 50000

- type: entity
  parent: ResearchDisk
  id: ResearchDiskDebug
  name: entity-researchdiskdebug-name
  suffix: DEBUG, DO NOT MAP
  description: entity-researchdiskdebug-description
  components:
  - type: ResearchDisk
    unlockAllTech: true

- type: entity
  parent: BaseItem
  id: TechnologyDisk
  name: entity-technologydisk-name
  description: entity-technologydisk-description
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: datadisk_base
      map: ["enum.DamageStateVisualLayers.Base"]
    - state: datadisk_label
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        datadisk_base: Sixteen
  - type: TechnologyDisk
  - type: StaticPrice
    price: 100
  - type: StealTarget
    stealGroup: TechnologyDisk

- type: entity
  parent: TechnologyDisk
  id: TechnologyDiskRare
  suffix: rare.
  components:
  - type: TechnologyDisk
    tierWeightPrototype: RareTechDiskTierWeights
  - type: EmitSoundOnPickup
    sound: /Audio/SimpleStation14/Items/Handling/disk_pickup.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/SimpleStation14/Items/Handling/disk_drop.ogg
  - type: EmitSoundOnLand
    sound: /Audio/SimpleStation14/Items/Handling/disk_drop.ogg
