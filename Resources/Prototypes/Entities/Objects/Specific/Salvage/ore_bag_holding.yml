- type: entity
  name: entity-orebagofholding-name
  id: OreBagOfHolding
  parent: OreBag
  description: entity-orebagofholding-description
  components:
  - type: MagnetPickup
    range: 2
  - type: Sprite
    sprite: Objects/Specific/Mining/ore_bag_holding.rsi
    layers:
    - state: orebag_off
      map: [ "enum.ToggleVisuals.Layer" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleVisuals.Toggled:
        enum.ToggleVisuals.Layer:
          True: { state: orebag_on }
          False: { state: orebag_off }
  - type: Clothing
    sprite: Objects/Specific/Mining/ore_bag_holding.rsi
  - type: Storage
    grid:
    - 0,0,19,9
