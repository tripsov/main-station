- type: entity
  parent: BaseItem
  id: DiseaseSwab
  name: entity-diseaseswab-name
  description: entity-diseaseswab-description
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Specific/Medical/mouth_swab.rsi
    state: icon
  - type: Tag
    tags:
    - Recyclable
    - Trash
  - type: BotanySwab
  - type: GuideHelp
    guides:
  # - Virology (when it's back)
    - Botany

- type: entity
  parent: BaseAmmoProvider # this is for cycling swabs out and not spawning 30 entities, trust
  id: BoxMouthSwab
  name: entity-boxmouthswab-name
  description: entity-boxmouthswab-description
