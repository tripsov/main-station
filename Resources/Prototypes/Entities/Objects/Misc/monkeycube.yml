- type: entity
  parent: BoxCardboard
  name: entity-monkeycubebox-name
  id: MonkeyCubeBox
  description: entity-monkeycubebox-description
  components:
  - type: StorageFill
    contents:
      - id: MonkeyCubeWrapped
        amount: 6
  - type: Storage
    grid:
    - 0,0,2,1
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box

- type: entity
  parent: BaseItem
  name: entity-monkeycubewrapped-name
  suffix: Wrapped
  id: MonkeyCubeWrapped
  description: entity-monkeycubewrapped-description
  components:
  - type: Item
    size: Tiny
  - type: SpawnItemsOnUse
    items:
      - id: MonkeyCube
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: wrapper
  - type: Tag
    tags:
    - MonkeyCube

- type: entity
  parent: MonkeyCubeBox
  name: entity-koboldcubebox-name
  id: KoboldCubeBox
  description: entity-koboldcubebox-description
  components:
  - type: StorageFill
    contents:
      - id: KoboldCubeWrapped
        amount: 6
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box_kobold

- type: entity
  parent: MonkeyCubeBox
  name: entity-variantcubebox-name
  id: VariantCubeBox
  description: entity-variantcubebox-description
  components:
  - type: StorageFill
    contents:
      - id: KoboldCubeWrapped
        amount: 3
      - id: MonkeyCubeWrapped
        amount: 3
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box_variant

- type: entity
  parent: MonkeyCubeWrapped
  name: entity-koboldcubewrapped-name
  suffix: Wrapped
  id: KoboldCubeWrapped
  description: entity-koboldcubewrapped-description
  components:
  - type: SpawnItemsOnUse
    items:
      - id: KoboldCube
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: wrapper_kobold

- type: entity
  parent: MonkeyCubeBox
  name: entity-monkeycubebox-name
  suffix: Syndicate
  id: SyndicateSpongeBox
  description: entity-monkeycubebox-description
  components:
  - type: Storage
    whitelist:
      tags:
      - MonkeyCube
  - type: StorageFill
    contents:
      - id: SyndicateSpongeWrapped
        amount: 6
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box

- type: entity
  parent: MonkeyCubeWrapped
  name: entity-monkeycubewrapped-name
  suffix: Wrapped, Syndicate
  id: SyndicateSpongeWrapped
  description: entity-monkeycubewrapped-description
  components:
  - type: SpawnItemsOnUse
    items:
      - id: SyndicateSponge
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: wrapper
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - MonkeyCube
