- type: entity
  parent: BaseItem
  id: UtensilBase
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Misc/utensils.rsi
  - type: Item # TODO add inhand sprites for all utensils
    sprite: Objects/Misc/utensils.rsi
  - type: SpaceGarbage
  # Shitmed Change
  - type: Tweezers # Any utensil can poorly remove organs
    speed: 0.2
  - type: SurgeryTool
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/retractor1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/hemostat1.ogg

- type: entity
  parent: UtensilBase
  id: UtensilBasePlastic
  abstract: true
  components:
  - type: Utensil
    breakChance: 0.20
  - type: StaticPrice
    price: 0
  - type: Tag
    tags:
    - Plastic
    - Trash
  - type: MeleeWeapon
    animationRotation: 180 # WWDP
    wideAnimationRotation: 180
    attackRate: .6666
    damage:
      types:
        Blunt: 0

- type: entity
  parent: UtensilBase
  id: Fork
  name: entity-fork-name
  description: entity-fork-description
  components:
  - type: Tag
    tags:
    - Hoe
    - Metal
  - type: Sprite
    state: fork
  - type: Utensil
    types:
    - Fork
  - type: MeleeWeapon
    animationRotation: 180 # WWDP
    wideAnimationRotation: 180
    attackRate: .6666
    damage:
      types:
        Piercing: 5
  # Shitmed Change
  - type: Tweezers # Forks are better than spoons
    speed: 0.35
  - type: DamageOtherOnHit
    staminaCost: 2.5
  - type: EmbeddableProjectile
    removalTime: 0.5
    autoRemoveDuration: 10
  - type: EmbedPassiveDamage
  - type: ThrowingAngle
    angle: 180

- type: entity
  parent: UtensilBasePlastic
  id: ForkPlastic
  name: entity-forkplastic-name
  description: entity-fork-description
  components:
  - type: Sprite
    state: plastic_fork
  - type: Utensil
    types:
    - Fork
  # Shitmed Change
  - type: Tweezers # Forks are better than spoons
    speed: 0.35

- type: entity
  parent: UtensilBase
  id: Spoon
  name: entity-spoon-name
  description: entity-spoon-description
  components:
  - type: Tag
    tags:
    - Metal
  - type: Sprite
    state: spoon
  - type: Item
    heldPrefix: spoon
  - type: Utensil
    types:
    - Spoon
  - type: MeleeWeapon
    animationRotation: 180 # WWDP
    wideAnimationRotation: 180
    attackRate: .6666
    damage:
      types:
        Blunt: 1
  - type: DamageOtherOnHit
  - type: ThrowingAngle
    angle: 180
  - type: Shovel
    speedModifier: 0.1 # you can try
  - type: ReactionMixer
    mixMessage: "spoon-mixing-success"
    timeToMix: 0.5
    reactionTypes:
    - Stir

- type: entity
  parent: UtensilBasePlastic
  id: SpoonPlastic
  name: entity-spoonplastic-name
  description: entity-spoon-description
  components:
  - type: Sprite
    state: plastic_spoon
  - type: Item
    heldPrefix: spoon
  - type: Utensil
    types:
    - Spoon
  - type: Shovel
    speedModifier: 0.1 # you can try
  - type: ReactionMixer
    mixMessage: "spoon-mixing-success"
    timeToMix: 0.5
    reactionTypes:
    - Stir

- type: entity
  parent: UtensilBasePlastic
  id: KnifePlastic
  name: entity-knifeplastic-name
  description: entity-knifeplastic-description
  components:
  - type: Sprite
    state: plastic_knife
  - type: Utensil
    types:
    - Knife
  - type: Tag
    tags:
    - Plastic
    - Trash
    - Knife

- type: entity
  parent: UtensilBase
  id: BarSpoon
  name: entity-barspoon-name
  description: entity-barspoon-description
  components:
  - type: Tag
    tags:
    - Metal
  - type: Sprite
    state: bar_spoon
  - type: Item
    heldPrefix: spoon
  - type: Utensil
    types:
    - Spoon
  - type: ReactionMixer
    mixMessage: "spoon-mixing-success"
    timeToMix: 0.5
    reactionTypes:
    - Stir
  - type: MeleeWeapon
    animationRotation: 180 # WWDP
    wideAnimationRotation: 180
    attackRate: .5
    damage:
      types:
        Blunt: 2
  - type: DamageOtherOnHit
  - type: ThrowingAngle
    angle: 180
  - type: Shovel
    speedModifier: 0.05 # nah
