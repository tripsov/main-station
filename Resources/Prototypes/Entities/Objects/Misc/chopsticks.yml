- type: entity
  parent: BaseItem
  id: ChopSticks
  name: entity-chopsticks-name
  description: entity-chopsticks-description
  components:
  - type: Sprite
    sprite: Objects/Misc/chopstick.rsi
    state: icon
  - type: Item
    sprite: Objects/Misc/chopstick.rsi
    size: Small
  - type: Utensil
    types:
    - Fork

- type: entity
  parent: BaseItem
  name: entity-pairedchopsticks-name
  id: PairedChopsticks
  description: entity-pairedchopsticks-description
  components:
  - type: SpawnItemsOnUse
    items:
      - id: ChopSticks
    sound:
      path: /Audio/Effects/chopstickbreak.ogg
  - type: Sprite
    sprite: Objects/Misc/chopstick.rsi
    state: paired
