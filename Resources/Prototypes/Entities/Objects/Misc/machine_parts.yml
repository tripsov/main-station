- type: entity
  id: BaseStockPart
  name: entity-basestockpart-name
  parent: BaseItem
  description: entity-basestockpart-description
  abstract: true
  components:
    - type: Sprite
      sprite: Objects/Misc/stock_parts.rsi
    - type: Item
      size: Tiny
    - type: Stack
      count: 1
    - type: PhysicalComposition #Goobstation - Recycle update
      materialComposition:
        Steel: 12
        Plastic: 12
    - type: StockPart # Goobstation

- type: entity
  id: CapacitorStockPart
  name: entity-capacitorstockpart-name
  parent: BaseStockPart
  description: entity-capacitorstockpart-description
  suffix: Rating 1
  components:
    - type: Sprite
      state: capacitor
    - type: MachinePart
      part: Capacitor
      rating: 1
    - type: ReverseEngineering # Nyano
      recipes:
        - CapacitorStockPart
    - type: Tag
      tags:
        - CapacitorStockPart
    - type: Stack
      stackType: Capacitor
  # WWDP quick crafts
    - type: Construction
      graph: MakeshiftLaserGraph
      node: capacitor

