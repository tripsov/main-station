- type: entity
  parent: BaseItem
  id: Holoprojector
  name: entity-holoprojector-name
  description: entity-holoprojector-description
  components:
  - type: Item
    storedRotation: -90
  - type: HolosignProjector
  - type: UseDelay
    delay: 0.5 # WD EDIT
  - type: Sprite
    sprite: Objects/Devices/Holoprojectors/custodial.rsi
    state: icon
  - type: Tag
    tags:
      - HolosignProjector
  - type: MeleeWeapon
    wideAnimationRotation: 90
    attackRate: 0.8
    damage:
      types:
        Blunt: 6.5
    bluntStaminaDamageFactor: 2
    heavyRateModifier: 0.9
    maxTargets: 1
    angle: 20
    soundHit:
      collection: MetalThud
  - type: DamageOtherOnHit

