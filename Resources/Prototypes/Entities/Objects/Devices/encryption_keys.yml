- type: entity
  abstract: true
  parent: BaseItem
  id: EncryptionKey
  name: entity-encryptionkey-name
  description: entity-encryptionkey-description
  components:
  - type: EncryptionKey
  - type: Item
    sprite: Objects/Devices/encryption_keys.rsi
  - type: Sprite
    sprite: Objects/Devices/encryption_keys.rsi

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyCommon
  name: entity-encryptionkeycommon-name
  description: entity-encryptionkeycommon-description
  components:
  - type: EncryptionKey
    channels:
    - Common
    defaultChannel: Common
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: common_label

