- type: entity
  parent: BaseItem
  id: DoorRemoteDefault
  name: entity-doorremotedefault-name
  description: entity-doorremotedefault-description
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Devices/door_remote.rsi
  - type: Item
    storedRotation: -90
  - type: Access #No access, useless
  - type: DoorRemote
  - type: StealTarget
    stealGroup: DoorRemote

- type: entity
  parent: DoorRemoteDefault
  id: DoorRemoteCommand
  name: entity-doorremotecommand-name
  components:
  - type: Sprite
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: "#e6e600"
    - state: door_remotescreencolour
      color: "#9f9f00"
  - type: Access
    groups:
    - AllAccess #Cap must be able to control the station

