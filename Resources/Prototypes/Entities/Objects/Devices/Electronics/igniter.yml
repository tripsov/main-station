- type: entity
  parent: BaseItem
  id: Igniter
  name: entity-igniter-name
  description: entity-igniter-description
  components:
  - type: Sprite
    sprite: Objects/Devices/igniter.rsi
    state: icon
  - type: IgnitionSource
    temperature: 800
  - type: IgniteOnTrigger
  - type: TriggerOnSignal
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: UseDelay # prevent sound spam
  - type: Tag
    tags:
    - Igniter
  # WWDP quick crafts
  - type: Construction
    graph: FireBomb
    node: igniter
