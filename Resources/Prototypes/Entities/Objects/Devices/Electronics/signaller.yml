#Remote Signaller Device

- type: entity
  parent: BaseItem
  id: RemoteSignaller
  name: entity-remotesignaller-name
  description: entity-remotesignaller-description
  components:
  - type: Sprite
    sprite: Objects/Devices/signaller.rsi
    state: signaller
  - type: Signaller
  - type: UseDelay
  - type: StaticPrice
    price: 40
  - type: DeviceLinkSource
    ports:
      - Pressed
  - type: Tag
    tags:
    - Payload
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 15

- type: entity
  parent: RemoteSignaller
  id: RemoteSignallerAdvanced
  name: entity-remotesignalleradvanced-name
  description: entity-remotesignalleradvanced-description
  components:
  - type: Sprite
    state: signaller2
  - type: WirelessNetworkConnection
    range: 50
  - type: StaticPrice
    price: 30
