# APC
- type: entity
  id: APCElectronics
  parent: BaseElectronics
  name: entity-apcelectronics-name
  description: entity-apcelectronics-description
  components:
    - type: ApcElectronics
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: charger_APC
    - type: ReverseEngineering # Nyano
      recipes:
        - APCElectronics
    - type: PhysicalComposition
      materialComposition:
        Glass: 50
      chemicalComposition:
        Silicon: 20
    - type: StaticPrice
      price: 34

