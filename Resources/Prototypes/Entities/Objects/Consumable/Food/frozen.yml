# Snowcone

# Use this one as a base for other colored snowcones. Apply a color to the alpha
# layer depending on soda/syrup/waterever. Name and description will also have
# to be modified.
- type: entity
  name: entity-foodfrozensnowconebase-name
  #  name: [Flavor] snowcone
  parent: FoodFrozenBase
  id: FoodFrozenSnowconeBase
  description: entity-foodfrozensnowconebase-description
  #  description: [Liquid] drizzled over a snowball in a paper cup.
  components:
    - type: Sprite
      layers:
        - state: cone
        - state: alpha-filling
    #      color: foo
    - type: Food
      trash: 
      - FoodFrozenSnowconeTrash
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 20 # For sprinkles or something? Idk.
          reagents:
            - ReagentId: Ice
              Quantity: 8
            - ReagentId: Water
              Quantity: 2
            - ReagentId: Sugar
              Quantity: 2

- type: entity
  name: entity-foodfrozensnowcone-name
  parent: FoodFrozenSnowconeBase
  id: FoodFrozenSnowcone
  description: entity-foodfrozensnowcone-description
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
          - ReagentId: Ice
            Quantity: 8

- type: entity
