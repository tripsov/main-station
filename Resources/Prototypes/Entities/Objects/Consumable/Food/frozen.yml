# Trash

- type: entity
  name: entity-foodfrozensnowconetrash-name
  parent: BaseItem
  id: FoodFrozenSnowconeTrash
  description: entity-foodfrozensnowconetrash-description
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
    state: cone-trash
  - type: Tag
    tags:
    - Trash

- type: entity
  name: entity-foodfrozenpopsicletrash-name
  parent: BaseItem
  id: FoodFrozenPopsicleTrash
  description: entity-foodfrozenpopsicletrash-description
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
    layers:
      - state: stick
        map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          stick: ""
          stick2: ""
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage
