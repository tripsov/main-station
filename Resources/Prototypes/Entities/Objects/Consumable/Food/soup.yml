  parent: FoodBowlBase
  id: FoodSoupPotato
  description: entity-foodsouppotato-description
  components:
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    layers:
    - state: bowl
    - state: sweetpotato
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
          - ReagentId: Nutriment
            Quantity: 4
          - ReagentId: Vitamin
            Quantity: 5
