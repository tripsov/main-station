- type: entity
  name: entity-foodousianadustbowl-name
  parent: FoodBowlBase # really dry soup i guess
  id: FoodOusianaDustBowl
  description: entity-foodousianadustbowl-description
  components:
  - type: Food
    useSound: "/Audio/Effects/Footsteps/snowstep4.ogg"
  - type: FlavorProfile
    flavors:
      - supernova
  - type: Sprite
    layers:
      - state: bowl
      - state: ousiana
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
          - ReagentId: OusianaDust
            Quantity: 5
  - type: Tag
    tags:
      - Soup
  - type: Construction
    graph: OusianaDustBowl
    node: ousianadustbowl
  - type: MeleeWeapon
    soundNoDamage:
      path: "/Audio/Effects/Footsteps/snowstep4.ogg"
    damage:
      types:
        Blunt: 0
