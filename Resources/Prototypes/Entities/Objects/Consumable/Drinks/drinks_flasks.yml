- type: entity
  parent: DrinkBase
  id: FlaskBase
  abstract: true
  components:
  - type: Drink
  - type: PhysicalComposition
    materialComposition:
      Steel: 300
  - type: FitsInDispenser
    solution: drink
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5

- type: entity
  parent: FlaskBase
  id: DrinkShinyFlask
  name: entity-drinkshinyflask-name
  description: entity-drinkshinyflask-description
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/shinyflask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkMREFlask
  name: entity-drinkmreflask-name
  description: entity-drinkmreflask-description
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/mreflask.rsi
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: Water
          Quantity: 50
  - type: TrashOnSolutionEmpty
    solution: drink

