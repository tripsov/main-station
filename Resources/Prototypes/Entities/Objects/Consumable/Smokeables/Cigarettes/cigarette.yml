- type: entity
  id: Cigarette
  parent: BaseCigar
  name: entity-cigarette-name
  description: entity-cigarette-description
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/cigarette.rsi
    state: unlit-icon
  - type: Tag
    tags:
      - Cigarette
      - Trash
  - type: SpaceGarbage
  - type: Clothing
    sprite: Objects/Consumable/Smokeables/Cigarettes/cigarette.rsi
    slots: [ mask ]
    equippedPrefix: unlit
  - type: Item
    size: Tiny
  - type: Construction
    graph: smokeable # WD EDIT
    node: cigarette

- type: entity
  id: SoakedCigarette
  parent: BaseCigar
  name: entity-cigarette-name
  suffix: Soaked
  description: entity-soakedcigarette-description
