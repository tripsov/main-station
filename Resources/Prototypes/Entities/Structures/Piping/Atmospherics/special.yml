# Devices which are not portable but don't link up to anything
- type: entity
  id: AtmosDeviceFanTiny
  name: entity-atmosdevicefantiny-name
  description: entity-atmosdevicefantiny-description
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/tinyfan.rsi
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
  - type: Airtight
    noAirWhenFullyAirBlocked: false
  - type: Clickable
  - type: Tag
    tags:
    - SpreaderIgnore
  # WD EDIT START
  - type: Construction
    graph: TinyFan
    node: tinyFan
  # WD EDIT END

- type: entity
  id: AtmosDeviceFanDirectional
  name: entity-atmosdevicefandirectional-name
