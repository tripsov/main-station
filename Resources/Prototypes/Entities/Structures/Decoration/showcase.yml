- type: entity
  id: BaseShowcaseRobot
  abstract: true
  parent: BaseStructure
  name: entity-baseshowcaserobot-name
  description: entity-baseshowcaserobot-description
  components:
    - type: Anchorable
    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: Metallic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 150
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 75
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                PartRodMetal1:
                  min: 5
                  max: 10
            - !type:DoActsBehavior
              acts: [ "Destruction" ]

- type: entity
  id: ShowcaseRobot
  parent: BaseShowcaseRobot
  name: entity-baseshowcaserobot-name
  description: entity-baseshowcaserobot-description
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_1

- type: entity
  id: ShowcaseRobotWhite
  parent: BaseShowcaseRobot
  name: entity-showcaserobotwhite-name
  description: entity-showcaserobotwhite-description
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_2

- type: entity
  id: ShowcaseRobotAntique
  parent: BaseShowcaseRobot
  name: entity-showcaserobotantique-name
  description: entity-showcaserobotantique-description
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_3

- type: entity
  id: ShowcaseRobotMarauder
  parent: BaseShowcaseRobot
  name: entity-showcaserobotmarauder-name
  description: entity-showcaserobotmarauder-description
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_4
