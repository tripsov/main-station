        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Airtight
  - type: StaticPrice
    price: 100
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.3
    sprintSpeedModifier: 0.3

- type: entity
  id: PlasticFlapsAirtightOpaque
