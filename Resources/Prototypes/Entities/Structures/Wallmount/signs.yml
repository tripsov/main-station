# see adverts for sign base
# see street_furniture for floor signs

# 32x32
- type: entity
  parent: SignBase
  id: SignBar2
  name: entity-signbar2-name
  description: entity-signbar2-description
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/signs_32x32.rsi
    state: bar

- type: entity
  parent: SignBar2
  id: SignClinic
  name: entity-signclinic-name
  description: entity-signclinic-description
  components:
  - type: Sprite
    state: clinic
  - type: PointLight
    radius: 3
    energy: 1
    color: '#00ff00'

- type: entity
  parent: SignBar2
  id: SignOpen1
  name: entity-signopen1-name
  description: entity-signopen1-description
  components:
  - type: Sprite
    state: open
  - type: PointLight
    radius: 3
    energy: 1
    color: '#ff0000'

- type: entity
  parent: SignOpen1
  id: SignOpen2
  components:
  - type: Sprite
    state: open_bar

- type: entity
  parent: SignOpen1
  id: SignOpenOn1
  components:
  - type: Sprite
    state: open_on

- type: entity
  parent: SignOpen1
  id: SignOpenOn2
  components:
  - type: Sprite
    state: open_bar_on

- type: entity
  parent: SignBase
  id: SignForRent
  name: entity-signforrent-name
  description: entity-signforrent-description
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/signs_32x32.rsi
    state: rent

- type: entity
  parent: SignBase
  id: SignNotice
  name: entity-signnotice-name
  description: entity-signnotice-description
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/walldecor.rsi
    state: notice_sign

- type: entity
  parent: SignNotice
  id: SignDanger2
  name: entity-signdanger2-name
  description: entity-signdanger2-description
  components:
  - type: Sprite
    state: danger_sign

- type: entity
  parent: SignNotice
  id: WallDecorExitsign
  name: entity-walldecorexitsign-name
  description: entity-walldecorexitsign-description
  components:
  - type: Sprite
    state: exit
    noRot: true

# 64x32
- type: entity
  parent: SignBar2
  id: SignBazaarOn
  name: entity-signbazaaron-name
  description: entity-signbazaaron-description
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/signs_64x32.rsi
    state: bazaar_on
  - type: PointLight
    radius: 2
    energy: 1
    color: '#ff8000'

- type: entity
  parent: SignBazaarOn
  id: SignHotel
  name: entity-signhotel-name
  description: entity-signhotel-description
  components:
  - type: Sprite
    state: hotel

- type: entity
  parent: SignBazaarOn
  id: SignPrivateProperty
  name: entity-signprivateproperty-name
  description: entity-signprivateproperty-description
  components:
  - type: Sprite
    state: private

- type: entity
  parent: SignBazaarOn
  id: SignOpenBig
  name: entity-signopen1-name
  description: entity-signopenbig-description
  components:
  - type: Sprite
    state: we_open_open
  - type: PointLight
    radius: 2
    energy: 1
    color: '#ff0000'

- type: entity
  parent: SignBazaarOn
  id: SignWorkersOnly
  name: entity-signworkersonly-name
  description: entity-signworkersonly-description
  components:
  - type: Sprite
    state: workers
