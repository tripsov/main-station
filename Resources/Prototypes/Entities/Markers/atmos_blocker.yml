- type: entity
  name: entity-atmosfixblockermarker-name
  id: AtmosFixBlockerMarker
  description: "Vacuum, T20C"
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi # {
          state: base
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded # }
          state: vacuum
    - type: AtmosFixMarker
      mode: 1

- type: entity
  name: entity-atmosfixoxygenmarker-name
