- type: entity
  name: entity-atmosfixfreezermarker-name
  id: AtmosFixFreezerMarker
  description: "Change air temp to 235K, for freezer with a big of wiggle room to get set up."
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi # {
          state: base
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded # }
          state: freeze
    - type: AtmosFixMarker
      mode: 6

- type: entity
  parent: AtmosFixNitrogenMarker
  id: AtmosFixVoxMarker
  suffix: Vox Atmosphere
  description: "Nitrogen @ 101 kPa, 20C"
  components:
  - type: AtmosFixMarker
    mode: 7

- type: entity
  id: AtmosFixCoolant
  suffix: Coolant
  description: "Supermatter coolant, equivalent to a liquid nitrogen canister"
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi # {
          state: base
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded # }
          state: nitrogen
    - type: AtmosFixMarker
      gasMix:
        volume: 2500
        moles:
          - 0 # oxygen
          - 9350.0 # nitrogen
        temperature: 72
