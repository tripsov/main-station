- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckHeadphones
  name: entity-clothingneckheadphones-name
  description: entity-clothingneckheadphones-description
  components:
  - type: Sprite
    sprite: Clothing/Neck/Misc/headphones.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleVisuals.Layer" ]
  - type: Clothing
    equippedPrefix: off
    sprite: Clothing/Neck/Misc/headphones.rsi
  - type: ToggleableLightVisuals
    spriteLayer: enum.ToggleVisuals.Layer
    clothingVisuals:
      neck:
      - state: on-equipped-NECK
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleVisuals.Toggled:
        enum.ToggleVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/Items/flashlight_on.ogg
    soundDeactivate:
      path: /Audio/Items/flashlight_off.ogg

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckStethoscope
  name: entity-clothingneckstethoscope-name
  description: entity-clothingneckstethoscope-description
  components:
  - type: Sprite
    sprite: Clothing/Neck/Misc/stethoscope.rsi
  - type: Clothing
    sprite: Clothing/Neck/Misc/stethoscope.rsi
  - type: Stethoscope

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckBling
  name: entity-clothingneckbling-name
  description: entity-clothingneckbling-description
  components:
  - type: Sprite
    sprite: Clothing/Neck/Misc/bling.rsi
  - type: Clothing
    sprite: Clothing/Neck/Misc/bling.rsi

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckLawyerbadge
  name: entity-clothingnecklawyerbadge-name
  description: entity-clothingnecklawyerbadge-description
  components:
  - type: Sprite
    sprite: Clothing/Neck/Misc/lawyerbadge.rsi
  - type: Clothing
    sprite: Clothing/Neck/Misc/lawyerbadge.rsi
  - type: TypingIndicatorClothing
    proto: lawyer

- type: entity
  id: ActionStethoscope
  name: entity-actionstethoscope-name
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTargetAction
    icon:
      sprite: Clothing/Neck/Misc/stethoscope.rsi
      state: icon
    event: !type:StethoscopeActionEvent
    checkCanInteract: false
    priority: -1

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckBellCollar
  name: entity-clothingneckbellcollar-name
  description: entity-clothingneckbellcollar-description
  components:
  - type: Sprite
    sprite: Clothing/Neck/Misc/bellcollar.rsi
  - type: Clothing
    sprite: Clothing/Neck/Misc/bellcollar.rsi
  - type: EmitsSoundOnMove
    soundCollection:
      collection: FootstepJester

- type: entity
