- type: entity
  parent: RingBase
  id: GoldRing
  name: entity-goldring-name
  description: entity-goldring-description
  components:
    - type: Sprite
      sprite: Clothing/Hands/Rings/basic.rsi
      layers:
        - state: ring
          color: "#ffc833"
    - type: StaticPrice
      price: 300
    - type: Appearance

- type: entity
  parent: RingBase
  id: SilverRing
  name: entity-silverring-name
  description: entity-silverring-description
  components:
    - type: Sprite
      sprite: Clothing/Hands/Rings/basic.rsi
      layers:
        - state: ring
    - type: StaticPrice
      price: 275
    - type: Appearance

- type: entity
  parent: RingBase
  id: GoldRingDiamond
  name: entity-goldringdiamond-name
  description: entity-goldringdiamond-description
  components:
    - type: Sprite
      sprite: Clothing/Hands/Rings/basic.rsi
      layers:
        - state: ring
          color: "#ffc833"
        - state: gem
          color: "#c1ffff"
    - type: StaticPrice
      price: 1500
    - type: Appearance

- type: entity
  parent: RingBase
  id: SilverRingDiamond
  name: entity-silverringdiamond-name
  description: entity-goldringdiamond-description
  components:
    - type: Sprite
      sprite: Clothing/Hands/Rings/basic.rsi
      layers:
        - state: ring
        - state: gem
          color: "#c1ffff"
    - type: StaticPrice
      price: 1400
    - type: Appearance

- type: entity
  parent: RingBase
  id: GoldRingGem
  name: entity-goldringgem-name
  description: entity-goldringgem-description
  components:
    - type: Sprite
      sprite: Clothing/Hands/Rings/basic.rsi
      layers:
        - state: ring
          color: "#ffc833"
        - state: gem
          map: [ "gemColor" ]
    - type: StaticPrice
      price: 2100
    - type: Appearance
    - type: RandomSprite
      getAllGroups: true
      available:
        - gemColor:
            gem: Rainbow

- type: entity
  parent: RingBase
  id: SilverRingGem
  name: entity-silverringgem-name
  description: entity-silverringgem-description
  components:
    - type: Sprite
      sprite: Clothing/Hands/Rings/basic.rsi
      layers:
        - state: ring
        - state: gem
          map: [ "gemColor" ]
    - type: StaticPrice
      price: 2000
    - type: Appearance
    - type: RandomSprite
      getAllGroups: true
      available:
        - gemColor:
            gem: Rainbow
