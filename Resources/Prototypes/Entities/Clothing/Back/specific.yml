- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackChameleon
  name: entity-clothingbackpackchameleon-name
  description: entity-clothingbackpackchameleon-description
  suffix: Chameleon
  components:
    - type: Tag
      tags: [] # ignore "WhitelistChameleon" tag
    - type: Sprite
      sprite: Clothing/Back/Backpacks/backpack.rsi
    - type: ChameleonClothing
      slot: [back]
      default: ClothingBackpack
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface
        enum.ChameleonUiKey.Key:
          type: ChameleonBoundUserInterface

- type: entity
  parent: Clothing
  id: ClothingBackpackWaterTank
  name: entity-clothingbackpackwatertank-name
  description: entity-clothingbackpackwatertank-description
  components:
  - type: Tag
    tags:
    - NozzleBackTank
    - WhitelistChameleon
  - type: Sprite
    sprite: Clothing/Back/Backpacks/waterbackpack.rsi
    state: icon
  - type: Item
    size: Ginormous
  - type: Clothing
    slots: BACK
    sprite: Clothing/Back/Backpacks/waterbackpack.rsi
  - type: SolutionAmmoProvider
    solutionId: tank
    proto: BulletWaterShot
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 1000 #much water
  - type: SolutionTransfer
    transferAmount: 50
    maxTransferAmount: 100
    minTransferAmount: 10
    canChangeTransferAmount: true
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: DrawableSolution
    solution: tank
  - type: RefillableSolution
    solution: tank
  - type: DrainableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank

- type: entity
  parent: Clothing
  id: ClothingBackpackEtherealTeleporter
  name: entity-clothingbackpacketherealteleporter-name
  description: entity-clothingbackpacketherealteleporter-description
  components:
    - type: Tag
      tags:
        - WhitelistChameleon
    - type: Sprite
      sprite: Clothing/Back/etherealteleporter.rsi
      state: icon
    - type: Item
      size: Ginormous
    - type: Clothing
      slots: BACK
      sprite: Clothing/Back/etherealteleporter.rsi
