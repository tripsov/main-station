- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterWinterCoat
  name: entity-clothingouterwintercoat-name
  description: entity-clothingouterwintercoat-description
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/WinterCoats/coat.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/WinterCoats/coat.rsi
  - type: TemperatureProtection
    coefficient: 0.1
  - type: Item
    size: Normal
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.95
        Heat: 0.90
    priceMultiplier: 0
