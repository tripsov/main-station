#Basic EVA
- type: entity
  parent: ClothingOuterEVASuitBase
  id: ClothingOuterHardsuitEVA
  name: entity-clothingouterhardsuiteva-name
  description: entity-clothingouterhardsuiteva-description
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva.rsi
  - type: Tag
    tags:
    - SuitEVA
    - MonkeyWearable
    - WhitelistChameleon
    - AllowLamiaHardsuit
    - HidesHarpyWings
  - type: Construction # WWDP
    graph: SuitEVA
    node: start

