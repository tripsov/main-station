- type: entity
  name: entity-boxcardboard-name
  parent: BoxBase
  id: BoxCardboard
  description: entity-boxcardboard-description
  components:
  - type: Item
    size: Large
    shape:
    - 0,0,2,2
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,3
  - type: Sprite
    state: box
  - type: EmitSoundOnPickup
    sound: /Audio/SimpleStation14/Items/Handling/cardboardbox_pickup.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/SimpleStation14/Items/Handling/cardboardbox_drop.ogg
  - type: EmitSoundOnLand
    sound: /Audio/SimpleStation14/Items/Handling/cardboardbox_drop.ogg
  - type: Tag
    tags:
    - BoxCardboard

