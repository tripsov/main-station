# As opposed to MagazineBox these are boxes of magazines so BoxMagazine
# CaselessRifle
- type: entity
  name: entity-boxmagazine-name
  parent: BoxCardboard
  id: BoxMagazine
  description: entity-boxmagazine-description
  components:
  - type: Sprite
    layers:
      - state: box_security
      - state: magazine

- type: entity
  name: entity-boxmagazinepistolcaselessrifle-name
  parent: BoxMagazine
  id: BoxMagazinePistolCaselessRifle
