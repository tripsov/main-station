- type: entity
  name: entity-boxhandcuff-name
  parent: BoxCardboard
  id: BoxHandcuff
  description: entity-boxhandcuff-description
  components:
  - type: Storage
    whitelist:
      components:
      - Handcuff
  - type: StorageFill
    contents:
      - id: Handcuffs
        amount: 4
  - type: Sprite
    layers:
      - state: box_security
      - state: handcuff

- type: entity
  name: entity-boxprisonerheadset-name
  parent: BoxCardboard
  id: BoxPrisonerHeadset
  description: entity-boxprisonerheadset-description
  components:
  - type: StorageFill
    contents:
    - id: ClothingHeadsetPrison
      amount: 4
  - type: Sprite
    layers:
    - state: box_security
    - state: headset

- type: entity
  name: entity-boxflashbang-name
  parent: BoxCardboard
  id: BoxFlashbang
  description: 'WARNING: These devices are extremely dangerous and can cause blindness or deafness in repeated use.'
  components:
  - type: StorageFill
    contents:
      - id: GrenadeFlashBang
        amount: 4
  - type: Sprite
    layers:
      - state: box_security
      - state: flashbang

- type: entity
  name: entity-boxsechud-name
  parent: BoxCardboard
  id: BoxSechud
  description: entity-boxsechud-description
  components:
  - type: StorageFill
    contents:
      - id: ClothingEyesGlassesSecurity # WD SecHuds
        amount: 4
  - type: Sprite
    layers:
      - state: box_security
      - state: sechud

- type: entity
  name: entity-boxziptie-name
  parent: BoxCardboard
  id: BoxZiptie
  description: entity-boxziptie-description
  components:
  - type: Storage
    grid:
    - 0,0,4,3
    whitelist:
      components:
      - Handcuff
  - type: StorageFill
    contents:
      - id: Zipties
        amount: 10
  - type: Sprite
    layers:
      - state: box_security
      - state: ziptie

- type: entity
  name: entity-boxforensicpad-name
  parent: BoxCardboard
  id: BoxForensicPad
  description: entity-boxforensicpad-description
  components:
  - type: Item
    shape:
    - 0,0,1,1
  - type: StorageFill
    contents:
    - id: ForensicPad
      amount: 9
  - type: Sprite
    layers:
      - state: box_security
      - state: forensic
