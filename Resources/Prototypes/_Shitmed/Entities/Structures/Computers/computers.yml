- type: entity
  parent: BaseComputer
  id: AbductorConsole
  name: entity-abductorconsole-name
  description: entity-abductorconsole-description
  components:
  - type: AbductorConsole
  - type: Sprite
    sprite: _Shitmed/Structures/Machines/abductor_console.rsi
    layers:
    - map: ["console"]
      state: console
  - type: ActivatableUI
    key: enum.AbductorConsoleUIKey.Key
  - type: UserInterface
    interfaces:
     enum.AbductorConsoleUIKey.Key:
        type: AbductorConsoleBui
  - type: PointLight
    enabled: true
    radius: 1.5
    energy: 1.6
    color: "#FC0097"

- type: entity
  parent: ComputerComms
  id: CentCommSectoralConsole
  name: entity-centcommsectoralconsole-name
  description: entity-centcommsectoralconsole-description
  components:
    - type: AccessReader
      access: [[ "Command" ]]
    - type: CommunicationsConsole
      title: comms-console-announcement-title-centcom
      global: true

- type: entity
  parent: BaseComputer
  id: AbductorHumanObservationConsole
  name: entity-abductorhumanobservationconsole-name
  description: entity-abductorhumanobservationconsole-description
  components:
  - type: Sprite
    sprite: _Shitmed/Structures/Machines/abductor_camera_console.rsi
    layers:
    - map: ["console"]
      state: console
  - type: AbductorHumanObservationConsole
  - type: ActivatableUI
    key: enum.AbductorCameraConsoleUIKey.Key
  - type: UserInterface
    interfaces:
     enum.AbductorCameraConsoleUIKey.Key:
        type: AbductorCameraConsoleBui
  - type: PointLight
    enabled: true
    radius: 1.5
    energy: 1.6
    color: "#FC0097"

- type: entity
  parent:
  - Incorporeal
  - BaseMob
  id: AbductorHumanObservationConsoleEye
  name: entity-abductorhumanobservationconsoleeye-name
  description: entity-abductorhumanobservationconsoleeye-description
  categories: [ HideSpawnMenu ]
  suffix: DO NOT MAP
  components:
  - type: NoFTL
  - type: WarpPoint
    follow: true
  - type: Eye
    pvsScale: 1.5
  - type: Visibility
    layer: 10
  - type: Sprite
    sprite: _Shitmed/Structures/Machines/abductor_camera_console.rsi
    layers:
    - state: eye
      shader: unshaded
  - type: Tag
    tags:
    - CantInteract
