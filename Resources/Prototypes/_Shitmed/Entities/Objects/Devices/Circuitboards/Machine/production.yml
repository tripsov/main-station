- type: entity
  parent: BaseMachineCircuitboard
  id: AutodocCircuitboard
  name: entity-autodoccircuitboard-name
  description: entity-autodoccircuitboard-description
  components:
  - type: MachineBoard
    prototype: Autodoc
    requirements:
      Manipulator: 4
    materialRequirements:
      Cable: 3
      Steel: 10
    tagRequirements:
      BorgArm:
        Amount: 3
        ExamineName: "Borg Arm"
        DefaultPrototype: LeftArmBorg

- type: entity
  parent: AutodocCircuitboard
  id: AutodocSyndieCircuitboard
  suffix: Syndie
  components:
  - type: MachineBoard
    prototype: AutodocSyndie

