# Actions
- type: entity
  id: ActionExitConsole
  name: entity-actionexitconsole-name
  description: entity-actionexitconsole-description
  components:
  - type: InstantAction
    priority: -20
    itemIconStyle: BigAction
    icon:
      sprite: _Shitmed/Interface/Actions/actions_abductor.rsi
      state: exit
    event: !type:ExitConsoleEvent

- type: entity
  id: ActionSendYourself
  name: entity-actionsendyourself-name
  description: entity-actionsendyourself-description
  components:
  - type: WorldTargetAction
    useDelay: 10
    priority: -19
    range: -1
    checkCanAccess: false
    itemIconStyle: BigAction
    icon:
      sprite: _Shitmed/Interface/Actions/actions_abductor.rsi
      state: send-yourself
    event: !type:SendYourselfEvent

- type: entity
  id: ActionReturnToShip
  name: entity-actionreturntoship-name
  description: entity-actionreturntoship-description
  components:
  - type: InstantAction
    useDelay: 30
    icon:
      sprite: _Shitmed/Interface/Actions/actions_abductor.rsi
      state: take
    priority: -12
    event: !type:AbductorReturnToShipEvent

