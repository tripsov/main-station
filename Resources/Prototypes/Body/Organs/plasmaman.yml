- type: entity
  id: BasePlasmamanOrgan
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Plasmaman/organs.rsi
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 5 # Not very nutritious
        - ReagentId: Plasma
          Quantity: 2.5
      food:
        maxVol: 5
        reagents:
        - ReagentId: Plasma
          Quantity: 5
  - type: Extractable
    grindableSolutionName: food
    juiceSolution:
      reagents:
      - ReagentId: Plasma
        Quantity: 5
  - type: FlavorProfile
    flavors:
      - plasma

- type: entity
  id: OrganPlasmamanLungs
  parent: [ BasePlasmamanOrgan, OrganHumanLungs ]
  name: entity-organplasmamanlungs-name
  description: entity-organplasmamanlungs-description
  components:
  - type: Sprite
    layers:
    - state: lungs
  - type: Metabolizer
    metabolizerTypes: [ Plasmaman ]
  - type: Lung
    alert: LowPlasma
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Plasma
          Quantity: 2.5
      Lung:
        maxVol: 100.0
        canReact: false
      food:
        maxVol: 5
        reagents:
        - ReagentId: Plasma
          Quantity: 5

- type: entity
  id: OrganPlasmamanStomach
  parent: [ BasePlasmamanOrgan, OrganHumanStomach ]
  name: entity-organplasmamanstomach-name
  description: entity-organplasmamanstomach-description
  components:
  - type: Metabolizer
    metabolizerTypes: [ Plasmaman ]
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 8
        - ReagentId: Plasma
          Quantity: 4
      stomach:
        maxVol: 50
      food:
        maxVol: 8
        reagents:
        - ReagentId: Plasma
          Quantity: 8
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Plasma
        Quantity: 8

- type: entity
  id: OrganPlasmamanEyes
  parent: [ BasePlasmamanOrgan, OrganHumanEyes ]
  name: entity-organplasmamaneyes-name
  components:
  - type: Sprite
    layers:
    - state: eyes

- type: entity
  id: OrganPlasmamanLiver
  parent: [ BasePlasmamanOrgan, OrganHumanLiver ]
  name: entity-organplasmamanliver-name
  components:
  - type: Metabolizer
    metabolizerTypes: [ Plasmaman ]

- type: entity
  id: OrganPlasmamanTongue
  parent: [ BasePlasmamanOrgan, OrganHumanTongue ]
  name: entity-organplasmamantongue-name

- type: entity
  id: OrganPlasmamanKidneys
  parent: [ BasePlasmamanOrgan, OrganHumanKidneys ]
  name: entity-organplasmamankidneys-name
  components:
  - type: Sprite
    layers:
    - state: kidneys
  - type: Metabolizer
    metabolizerTypes: [ Plasmaman ]

- type: entity
  id: OrganPlasmamanHeart
  parent: [ BasePlasmamanOrgan, OrganHumanHeart ]
  name: entity-organplasmamanheart-name
  description: entity-organplasmamanheart-description
  components:
  - type: Metabolizer
    metabolizerTypes: [ Plasmaman ]

- type: entity
  id: OrganPlasmamanBrain
  parent: [ BasePlasmamanOrgan, OrganHumanBrain ]
  name: entity-organplasmamanbrain-name
  components:
