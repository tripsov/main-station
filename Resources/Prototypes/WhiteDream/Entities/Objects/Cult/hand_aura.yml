- type: entity
  parent: BaseItem
  id: BaseBloodCultAura
  name: entity-basebloodcultaura-name
  description: entity-basebloodcultaura-description
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Item
    size: Ginormous
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0
    heavyStaminaCost: 0
    maxTargets: 1
    animation: WeaponArcSlash
    angle: 1
  - type: Unremoveable
    deleteOnDrop: true
  - type: CultItem
  - type: DeleteOnDrop

- type: entity
  parent: BaseBloodCultAura
  id: BloodRitesAura
  name: entity-bloodritesaura-name
  description: entity-bloodritesaura-description
  components:
  - type: Sprite
    sprite: WhiteDream/BloodCult/Entities/Items/rites.rsi
    state: icon
  - type: BloodRitesAura
  - type: UserInterface
    interfaces:
      enum.BloodRitesUiKey.Key:
        type: BloodRitesUi
  - type: ActivatableUI
    key: enum.BloodRitesUiKey.Key
    inHandsOnly: true
    requireActiveHand: false

- type: entity
  parent: BaseBloodCultAura
  id: StunAura
  name: entity-stunaura-name
  description: entity-stunaura-description
  components:
  - type: Sprite
    sprite: WhiteDream/BloodCult/Entities/Items/stun.rsi
    state: icon
  - type: Item
    sprite: WhiteDream/BloodCult/Entities/Items/stun.rsi
  - type: StunAura
    speech: Fuu ma'jin!

- type: entity
  parent: BaseBloodCultAura
  id: ShadowShacklesAura
  name: entity-shadowshacklesaura-name
  description: entity-shadowshacklesaura-description
  components:
  - type: Sprite
    sprite: WhiteDream/BloodCult/Entities/Items/shadow_shaсkles.rsi
    state: icon
  - type: Item
    sprite: WhiteDream/BloodCult/Entities/Items/shadow_shaсkles.rsi
  - type: ShadowShacklesAura
    speech: In'totum Lig'abis!
