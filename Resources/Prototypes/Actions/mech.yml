- type: entity
  id: ActionMechCycleEquipment
  name: entity-actionmechcycleequipment-name
  description: entity-actionmechcycleequipment-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_cycle_equip_on
    event: !type:MechToggleEquipmentEvent
    useDelay: 0.5

- type: entity
  id: ActionMechOpenUI
  name: entity-actionmechopenui-name
  description: entity-actionmechopenui-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_view_stats
    event: !type:MechOpenUiEvent
    useDelay: 1

- type: entity
  id: ActionMechEject
  name: entity-actionmecheject-name
  description: entity-actionmecheject-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_eject
    event: !type:MechEjectPilotEvent


