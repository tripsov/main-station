- type: entity
  id: DionaGibAction
  name: entity-dionagibaction-name
  description: entity-dionagibaction-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    icon:
      sprite: Mobs/Species/Diona/organs.rsi
      state: brain
    event: !type:GibActionEvent {}
    checkCanInteract: false
    checkConsciousness: false

- type: entity
  id: DionaReformAction
  name: entity-dionareformaction-name
  description: entity-dionareformaction-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    icon:
      sprite: Mobs/Species/Diona/parts.rsi
      state: full
    event: !type:ReformEvent {}
    useDelay: 600 # Once every 10 minutes. Keep them dead for a fair bit before reforming
