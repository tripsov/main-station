- type: entity
  id: ActionViewLaws
  name: entity-actionviewlaws-name
  description: entity-actionviewlaws-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_borg.rsi
      state: state-laws
    event: !type:ToggleLawsScreenEvent
    useDelay: 0.5

- type: entity
  id: ActionSelectBorgType
  name: entity-actionselectborgtype-name
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_borg.rsi
      state: select-type
    event: !type:BorgToggleSelectTypeEvent
    useDelay: 0.5
