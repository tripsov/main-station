# gloves
- type: entity
  id: ActionToggleNinjaGloves
  name: entity-actiontoggleninjagloves-name
  description: entity-actiontoggleninjagloves-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    priority: -13
    event: !type:ToggleActionEvent {}

# suit
- type: entity
  id: ActionCreateThrowingStar
  name: entity-actioncreatethrowingstar-name
  description: entity-actioncreatethrowingstar-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 0.5
    icon:
      sprite: Objects/Weapons/Throwable/throwing_star.rsi
      state: icon
    itemIconStyle: NoItem
    priority: -10
    event: !type:CreateItemEvent {}

- type: entity
  id: ActionRecallKatana
  name: entity-actionrecallkatana-name
  description: entity-actionrecallkatana-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 1
    icon:
      sprite: Objects/Weapons/Melee/energykatana.rsi
      state: icon
    itemIconStyle: NoItem
    priority: -11
    event: !type:RecallKatanaEvent {}

- type: entity
  id: ActionNinjaEmp
  name: entity-actionninjaemp-name
  description: entity-actionninjaemp-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    icon:
      sprite: Objects/Weapons/Grenades/empgrenade.rsi
      state: icon
    itemIconStyle: BigAction
    priority: -13
    event: !type:NinjaEmpEvent {}

- type: entity
  id: ActionTogglePhaseCloak
  name: entity-actiontogglephasecloak-name
  description: entity-actiontogglephasecloak-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    # have to plan (un)cloaking ahead of time
    useDelay: 5
    priority: -9
    event: !type:ToggleActionEvent

# katana
- type: entity
  id: ActionEnergyKatanaDash
  name: entity-actionenergykatanadash-name
  description: entity-actionenergykatanadash-description
  categories: [ HideSpawnMenu ]
  components:
  - type: WorldTargetAction
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: blink
    itemIconStyle: NoItem
    sound:
      path: /Audio/Magic/blink.ogg
      params:
        volume: 5
    priority: -12
    event: !type:DashEvent
    checkCanAccess: false
    range: 0
