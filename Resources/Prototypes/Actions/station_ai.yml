# Actions
- type: entity
  id: ActionJumpToCore
  name: entity-actionjumptocore-name
  description: entity-actionjumptocore-description
  components:
  - type: InstantAction
    priority: -10
    itemIconStyle: BigAction
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: ai_core
    event: !type:JumpToCoreEvent

- type: entity
  id: ActionShowJobIcons
  name: entity-actionshowjobicons-name
  description: entity-actionshowjobicons-description
  components:
  - type: InstantAction
    priority: -5
    itemIconStyle: BigAction
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: job_view
    event: !type:ActionComponentChangeEvent
      components:
      - type: ShowJobIcons
      - type: ShowCriminalRecordIcons # WD edit

- type: entity
  id: ActionSurvCameraLights
  name: entity-actionsurvcameralights-name
  description: entity-actionsurvcameralights-description
  components:
  - type: InstantAction
    priority: -6
    itemIconStyle: BigAction
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: camera_light
    event: !type:RelayedActionComponentChangeEvent
      components:
      - type: LightOnCollideCollider
      - type: FixturesChange
        fixtures:
          lightTrigger:
            shape:
              !type:PhysShapeCircle
              radius: 0.35
            density: 80
            hard: false
            layer:
            - GhostImpassable


- type: entity
  id: ActionAIViewLaws
  name: entity-actionaiviewlaws-name
  description: entity-actionaiviewlaws-description
  components:
  - type: InstantAction
    priority: -3
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: state_laws
    event: !type:ToggleLawsScreenEvent
    useDelay: 0.5
