- type: entity
  id: ActionRevertPolymorph
  name: entity-actionrevertpolymorph-name
  description: entity-actionrevertpolymorph-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    event: !type:RevertPolymorphActionEvent

- type: entity
  id: ActionPolymorph
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    event: !type:PolymorphActionEvent
    itemIconStyle: NoItem

- type: entity
  id: ActionPolymorphWizardSpider
  name: entity-actionpolymorphwizardspider-name
  description: entity-actionpolymorphwizardspider-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 60
    event: !type:PolymorphActionEvent
      protoId: WizardSpider
    itemIconStyle: NoItem
    icon:
      sprite: Mobs/Animals/spider.rsi
      state: tarantula

- type: entity
  id: ActionPolymorphWizardRod
  name: entity-actionpolymorphwizardrod-name
  description: entity-actionpolymorphwizardrod-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 60
    event: !type:PolymorphActionEvent
      protoId: WizardRod
    itemIconStyle: NoItem
    icon:
      sprite: Objects/Fun/immovable_rod.rsi
      state: icon
