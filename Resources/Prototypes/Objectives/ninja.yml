- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseNinjaObjective
  components:
  - type: Objective
    # difficulty isn't used all since objectives are picked
    difficulty: 1.5
    issuer: spiderclan
  - type: RoleRequirement
    roles:
      mindRoles:
      - NinjaRole

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseNinjaObjective
  id: DoorjackObjective
  components:
  - type: Objective
    icon:
      sprite: Objects/Tools/emag.rsi
      state: icon
  - type: NumberObjective
    min: 15
    max: 40
    title: objective-condition-doorjack-title
    description: objective-condition-doorjack-description
  - type: DoorjackCondition

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseNinjaObjective
  id: StealResearchObjective
  description: Your gloves can be used to hack a research server and steal its precious data. If epistemics has been slacking you'll have to get to work. # DeltaV - Epistemics Department replacing Science
  components:
  - type: Objective
    icon:
      sprite: Structures/Machines/server.rsi
      state: server
  - type: NumberObjective
    min: 9
    max: 13
    title: objective-condition-steal-research-title
  - type: StealResearchCondition

- type: entity
  categories: [ HideSpawnMenu ]
  parent: [BaseNinjaObjective, BaseCodeObjective]
  id: SpiderChargeObjective
  description: entity-spiderchargeobjective-description
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Bombs/spidercharge.rsi
      state: icon

- type: entity
  categories: [ HideSpawnMenu ]
  parent: [BaseNinjaObjective, BaseSurviveObjective]
  id: NinjaSurviveObjective
  name: entity-ninjasurviveobjective-name
  description: entity-ninjasurviveobjective-description
  components:
  - type: Objective
    icon:
      sprite: Clothing/Mask/ninja.rsi
      state: icon

- type: entity
  categories: [ HideSpawnMenu ]
  parent: [BaseNinjaObjective, BaseCodeObjective]
  id: TerrorObjective
  name: entity-terrorobjective-name
  description: entity-terrorobjective-description
  components:
  - type: Objective
    icon:
      sprite: Objects/Fun/Instruments/otherinstruments.rsi
      state: red_phone

- type: entity
  categories: [ HideSpawnMenu ]
  parent: [BaseNinjaObjective, BaseCodeObjective]
  id: MassArrestObjective
  name: entity-massarrestobjective-name
  description: entity-massarrestobjective-description
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Melee/stunbaton.rsi
      state: stunbaton_on
