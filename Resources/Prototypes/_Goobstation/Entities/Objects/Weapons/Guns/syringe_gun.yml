- type: entity
  parent: BaseStorageItem
  id: BaseSyringeGun
  abstract: true
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Cannons/syringe_gun.rsi
    state: icon
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,0,0
    whitelist:
      tags:
      - SyringeGunAmmo
  - type: Gun
    fireRate: 1
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/syringe_gun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
    clumsyProof: true
  - type: ContainerAmmoProvider
    container: storagebase
  - type: Item
    size: Normal
    shape:
    - 0,0,3,0
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: SyringeGun
  - type: Tag
    tags:
    - Gun
    - Weapon

- type: entity
  parent: [ BaseSyringeGun, BaseGrandTheftContraband ]
  id: SyringeGun
  name: entity-syringegun-name
  description: entity-syringegun-description
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Cannons/syringe_gun.rsi
    state: icon
  - type: Item
    sprite: _Goobstation/Objects/Weapons/Guns/Cannons/syringe_gun.rsi
  - type: Tag
    tags:
    - Gun
    - Weapon
    - SyringeGunAmmo

- type: entity
  name: entity-rapidsyringegun-name
  parent: [ BaseSyringeGun, BaseGrandTheftContraband ]
  id: RapidSyringeGun
  description: entity-rapidsyringegun-description
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Cannons/rapid_syringe_gun.rsi
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Cannons/rapid_syringe_gun.rsi
    slots:
    - back
    - suitStorage
    quickEquip: false
  - type: Storage
    grid:
    - 0,0,2,1
  - type: Gun
    fireRate: 2
  - type: SyringeGun
    injectionSpeedMultiplier: 1.5
  - type: Item
    size: Large
    shape:
    - 0,0,3,1
  - type: StealTarget
    stealGroup: RapidSyringeGun
  - type: Tag
    tags:
    - HighRiskItem

- type: entity
  parent: [ BaseSyringeGun, BaseSyndicateContraband ]
  id: DartSyringeGun
  name: entity-dartsyringegun-name
  description: entity-dartsyringegun-description
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Cannons/syringe_gun.rsi
    state: icon-dart
  - type: Item
    sprite: _Goobstation/Objects/Weapons/Guns/Cannons/syringe_gun.rsi
  - type: Storage
    grid:
    - 0,0,3,0
  - type: SyringeGun
    pierceArmor: true
  - type: Tag
    tags:
    - Gun
    - Weapon
    - SyringeGunAmmo

