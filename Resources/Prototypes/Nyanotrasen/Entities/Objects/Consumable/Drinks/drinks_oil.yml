- type: entity
  parent: DrinkBottleGlassBaseFull
  id: BaseOilJar
  abstract: true
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Drinks/oil_jar.rsi
    state: icon
    layers:
      - state: icon
        map: ["drinkCanIcon"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        drinkCanIcon:
          True: {state: "icon_open"}
          False: {state: "icon"}

- type: entity
  parent: BaseOilJar
  id: OilJarGhee
  name: entity-oiljarghee-name
  description: entity-oiljarghee-description
  components:
  - type: Sprite
    layers:
      - state: icon
        map: ["drinkCanIcon"]
      - state: butter
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
        reagents:
        - ReagentId: OilGhee
          Quantity: 100

- type: entity
  parent: BaseOilJar
  id: OilJarCorn
  name: entity-oiljarcorn-name
  description: entity-oiljarcorn-description
  components:
  - type: Sprite
    layers:
      - state: icon
        map: ["drinkCanIcon"]
      - state: corn
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
        reagents:
        - ReagentId: Cornoil
          Quantity: 100

- type: entity
  parent: BaseOilJar
  id: OilJarOlive
  name: entity-oiljarolive-name
  description: entity-oiljarolive-description
  components:
  - type: Sprite
    layers:
      - state: icon
        map: ["drinkCanIcon"]
      - state: olives
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
        reagents:
        - ReagentId: OilOlive
          Quantity: 100
