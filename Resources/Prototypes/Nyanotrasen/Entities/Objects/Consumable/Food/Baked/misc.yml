- type: entity
  name: entity-foodmothcheesecakeballs-name
  parent: FoodBakedBase
  id: FoodMothCheesecakeBalls
  description: entity-foodmothcheesecakeballs-description
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - cheesy
      - honey
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/Baked/misc.rsi
    state: cheesecakes
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: Protein
          Quantity: 1
        - ReagentId: Sugar
          Quantity: 12
  - type: Tag
    tags:
      - ClothMade # Mothic Food
#Tastes like cheesecake and honey

- type: entity
  name: entity-foodmothmothmallow-name
  parent: FoodBakedBase
  id: FoodMothMothmallow
  description: entity-foodmothmothmallow-description
  components:
  - type: FlavorProfile
    flavors:
      - vanilla
      - sweet
      - sublime
  - type: SliceableFood
    count: 5
    slice: FoodMothMothmallowSlice
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/Baked/misc.rsi
    state: mothmallow
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Sugar
          Quantity: 10
  - type: Tag
    tags:
      - ClothMade # Mothic Food
#Tastes like vanilla and clouds.

- type: entity
  name: entity-foodmothmothmallowslice-name
