# PSB, Prepacked Sustenance Bar. With variety.
- type: entity
  categories: [ HideSpawnMenu ]
  parent: FoodPacketTrash
  id: FoodPSBTrash
  name: entity-foodpsbtrash-name
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/ration.rsi
    state: psb-trash
  - type: Item

- type: entity
  name: entity-foodpsb-name
  parent: BaseItem
  id: FoodPSB
  description: entity-foodpsb-description
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/ration.rsi
    state: psb
  - type: Item
    size: Tiny
  - type: SpaceGarbage
  - type: StaticPrice #DynamicPrice
    price: 0
  - type: SpawnItemsOnUse
    items:
      - id: FoodPSBTrash
      - id: FoodPSBBarSoy
        prob: 0.3
        orGroup: PSB
      - id: FoodPSBBarCheese
        prob: 0.3
        orGroup: PSB
      - id: FoodPSBBarMeat
        prob: 0.3
        orGroup: PSB
      - id: FoodPSBBarVegetable
        prob: 0.3
        orGroup: PSB
      - id: FoodPSBBarMint
        prob: 0.2
        orGroup: PSB
      - id: FoodPSBBarNeapolitan
        prob: 0.2
        orGroup: PSB
      - id: FoodPSBBarBrownie
        prob: 0.2
        orGroup: PSB
      - id: FoodPSBBarBanana
        prob: 0.1
        orGroup: PSB
      - id: FoodPSBBarWonka
        prob: 0.1
        orGroup: PSB
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: FoodSnackBase
  id: FoodPSBBase
  abstract: true
  components:
  - type: Item
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/ration.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 15
  - type: Tag
    tags:
    - Fruit # DeltaV - Allow anyone to eat it, hopefully

- type: entity
  name: entity-foodpsbbarsoy-name
  parent: FoodPSBBase
  id: FoodPSBBarSoy
  description: entity-foodpsbbarsoy-description
  components:
  - type: FlavorProfile
    flavors:
      - fiber
  - type: Sprite
    state: psb-bar-soy
  - type: Item

- type: entity
  name: entity-foodpsbbarneapolitan-name
  parent: FoodPSBBase
  id: FoodPSBBarNeapolitan
  description: entity-foodpsbbarneapolitan-description
