#         - NonEnergy
# WD EDIT END

- type: entity
  parent: [ClothingModsuitBootsStandard, TCFLInfo]
  id: ClothingModsuitBootsTCFLLegionnaire
  name: entity-clothingmodsuitbootstcfllegionnaire-name
  description: entity-clothingmodsuitbootstcfllegionnaire-description
  categories: [HideSpawnMenu]
  components:
    - type: Appearance
    - type: Sprite
      sprite: _EE/Clothing/BieselRepublic/Modsuits/legionnaire.rsi
    - type: Tag
      tags:
        - WhitelistChameleon
    - type: ClothingSpeedModifier
      walkModifier: 1
      sprintModifier: 1
    - type: ToggleClothing
      action: ActionToggleMagboots
    - type: ComponentToggler
      components:
        - type: NoSlip
    - type: Magboots
    - type: SealableClothingVisuals
      visualLayers:
        shoes:
        - state: equipped-FEET-sealed

- type: entity
  id: SuitStorageTCFLLegionnaire
  parent: SuitStorageBase
  suffix: TCFL Modsuit
  components:
    - type: StorageFill
      contents:
          - id: OxygenTankFilled
          - id: ClothingModsuitTCFLLegionnaire
          - id: ClothingMaskBreath
