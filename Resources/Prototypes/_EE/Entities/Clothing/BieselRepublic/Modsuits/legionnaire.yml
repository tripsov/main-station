- type: entity
  parent: [ClothingModsuitChestplateStandard, TCFLInfo]
  id: ClothingModsuitChestplateTCFLLegionnaire
  name: entity-clothingmodsuitchestplatetcfllegionnaire-name
  description: entity-clothingmodsuitchestplatetcfllegionnaire-description
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _EE/Clothing/BieselRepublic/Modsuits/legionnaire.rsi
    - type: ClothingSpeedModifier
      walkModifier: 0.9
      sprintModifier: 0.9
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.50
          Slash: 0.50
          Piercing: 0.50
          Heat: 0.50
          Radiation: 0.50
          Caustic: 0.50
    - type: TemperatureProtection
      coefficient: 0.01
    - type: StaminaDamageResistance
      coefficient: 0.5
    - type: EmitsSoundOnMove
      soundCollection:
        collection: FootstepHardsuitMedium
        params:
          volume: -5
      requiresWorn: true
      distanceWalking: 2
      distanceSprinting: 3
    - type: SealableClothingVisuals
      visualLayers:
        outerClothing:
        - state: equipped-OUTERCLOTHING-sealed
        - state: equipped-OUTERCLOTHING-sealed-unshaded
          shader: unshaded
