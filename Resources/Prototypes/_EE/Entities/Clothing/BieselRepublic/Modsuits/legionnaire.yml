# The Modsuit Itself
- type: entity
  parent: [ClothingModsuitStandard, TCFLInfo]
  id: ClothingModsuitTCFLLegionnaire
  name: entity-clothingmodsuittcfllegionnaire-name
  description: entity-clothingmodsuittcfllegionnaire-description
  components:
    - type: Sprite
      sprite: _EE/Clothing/BieselRepublic/Modsuits/legionnaire.rsi
    - type: ExplosionResistance
      damageCoefficient: 0.5
    - type: ToggleableClothing
      clothingPrototypes:
        head: ClothingModsuitHelmetTCFLLegionnaire
        gloves: ClothingModsuitGauntletsTCFLLegionnaire
        outerClothing: ClothingModsuitChestplateTCFLLegionnaire
        shoes: ClothingModsuitBootsTCFLLegionnaire
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellHyper
          whitelist:
            components:
              - PowerCell
    - type: Storage
      maxItemSize: Huge
      grid:
        - 0,0,7,4

- type: entity
  parent: [ClothingModsuitGauntletsStandard, TCFLInfo]
  id: ClothingModsuitGauntletsTCFLLegionnaire
  name: entity-clothingmodsuitgauntletstcfllegionnaire-name
  description: entity-clothingmodsuitgauntletstcfllegionnaire-description
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _EE/Clothing/BieselRepublic/Modsuits/legionnaire.rsi

- type: entity
  parent: [ClothingModsuitHelmetStandard, TCFLInfo, ShowSecurityIcons, BaseClothingRadio]
  id: ClothingModsuitHelmetTCFLLegionnaire
  name: entity-clothingmodsuithelmettcfllegionnaire-name
  description: entity-clothingmodsuithelmettcfllegionnaire-description
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _EE/Clothing/BieselRepublic/Modsuits/legionnaire.rsi
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.85
          Slash: 0.85
          Piercing: 0.85
          Heat: 0.85
          Radiation: 0.95
    - type: ShowHealthBars
      damageContainers:
        - Biological
    - type: PointLight
      color: "#FFDF00"
    - type: SealableClothingVisuals
      visualLayers:
        head:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
