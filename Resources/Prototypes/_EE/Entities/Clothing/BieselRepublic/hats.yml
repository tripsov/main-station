# Headgear other than armor
- type: entity
  parent: [ClothingHeadHardsuitBase, TCFLInfo, BaseClothingRadio]
  id: ClothingHeadHelmetHardsuitTCFLTacsuit
  name: entity-clothingheadhelmethardsuittcfltacsuit-name
  suffix: TCFL
  description: entity-clothingheadhelmethardsuittcfltacsuit-description
  components:
    - type: Sprite
      sprite: _EE/Clothing/BieselRepublic/Helmet/TCFL_tacsuit_helmet.rsi
    - type: Clothing
      sprite: _EE/Clothing/BieselRepublic/Helmet/TCFL_tacsuit_helmet.rsi
      clothingVisuals:
        head:
        - state: equipped-HELMET
        - state: equipped-HELMET-unshaded
          shader: unshaded
    - type: PressureProtection
      highPressureMultiplier: 0.08
      lowPressureMultiplier: 1000
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.9
          Slash: 0.9
          Piercing: 0.9
          Heat: 0.9
    - type: BreathMask

- type: entity
  parent: [ClothingHeadHelmetBasic, TCFLInfo, BaseClothingRadio]
  id: ClothingHeadHelmetTCFLHeavy
  name: entity-clothingheadhelmettcflheavy-name
  suffix: TCFL
  description: entity-clothingheadhelmettcflheavy-description
  components:
    - type: Sprite
      sprite: _EE/Clothing/BieselRepublic/Helmet/TCAF_tactical_helmet_full.rsi
    - type: Clothing
      sprite: _EE/Clothing/BieselRepublic/Helmet/TCAF_tactical_helmet_full.rsi
      clothingVisuals:
        head:
        - state: equipped-HELMET
        - state: equipped-HELMET-unshaded
          shader: unshaded
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.875
          Slash: 0.875
          Piercing: 0.875
          Heat: 0.875
          Caustic: 0.875
