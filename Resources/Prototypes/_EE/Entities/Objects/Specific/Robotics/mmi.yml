- type: entity
  parent: MMI
  id: AiAdapter
  name: entity-aiadapter-name
  description: entity-aiadapter-description
  components:
    - type: Sprite
      sprite: _EE/Objects/Specific/Robotics/paiadapter.rsi
      layers:
      - state: mmi_off
        map: ["enum.MMIVisualLayers.Base"]
      - state: mmi_brain
        map: ["enum.MMIVisualLayers.Brain"]
        visible: false
    - type: ItemSlots
      slots:
        brain_slot:
          name: positronic-brain-slot-component-slot-name-brain
          whitelist:
            components:
            - PAI
    - type: Organ
      slotId: posibrain
    - type: Tag
      tags:
      - Posibrain
    - type: Construction
      graph: AiAdapter
      node: paiadapter

- type: entity
  parent: MMI
  id: ReverseMMI
  name: entity-reversemmi-name
  description: entity-reversemmi-description
  components:
    - type: Sprite
      sprite: _EE/Objects/Specific/Robotics/reversemmi.rsi
      layers:
      - state: mmi_brain
        map: ["enum.MMIVisualLayers.Brain"]
        visible: false
      - state: mmi_off
        map: ["enum.MMIVisualLayers.Base"]
    - type: ItemSlots
      slots:
        brain_slot:
          name: pai-system-role-name
          whitelist:
            tags:
            - Posibrain
    - type: Organ
      slotId: brain
