        whitelist:
          tags:
            - MagazineCaselessRifle
      gun_chamber:
        name: Chamber
        startingItem: null
        priority: 1
        whitelist:
          tags:
            - CartridgeCaselessRifle

- type: entity
  name: entity-weaponsubmachinegunbrdir25-name
  parent: [BaseWeaponSubMachineGun, BaseGunWieldable]
  id: WeaponSubMachineGunBRDIR25
  description: entity-weaponsubmachinegunbrdir25-description
  components:
  - type: Sprite
    sprite: _EE/Objects/Weapons/Guns/SMGs/BRDI_R25.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _EE/Objects/Weapons/Guns/SMGs/BRDI_R25.rsi
  - type: Wieldable
  - type: GunWieldBonus
    minAngle: -17
    maxAngle: -22
  - type: Gun
    minAngle: 21
    maxAngle: 32
    fireRate: 5  # 300rpm in Semi & Full Auto
    burstFireRate: 20  # 1200rpm in Burst mode.
    shotsPerBurst: 3
    burstCooldown: 0.9
    cameraRecoilScalar: 0.5
    selectedMode: Burst
    soundGunshot:
      path: /Audio/_EE/Weapons/Guns/Gunshots/fpa-90-suppressed-gunshot.ogg
      params:
        volume: -3
        maxDistance: 8
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    fireOnDropChance: 0.3
  - type: ChamberMagazineAmmoProvider
    autoEject: true
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 1500
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineCaselessRifle
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineCaselessRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeCaselessRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeCaselessRifle
  - type: ExtendDescription
    descriptionList:
      - description: "gun-suppressed"
        fontSize: 10
        color: "#ff4f00"
        requireDetailRange: false
  - type: Item # WWDP guns resize
    shape:
    - 0,0,5,1 # SMG sized

- type: entity
  name: entity-weaponsubmachinegunbrdir25hos-name
  parent: WeaponSubMachineGunBRDIR25
  id: WeaponSubMachineGunBRDIR25HoS
  description: entity-weaponsubmachinegunbrdir25hos-description
  components:
    - type: StealTarget
      stealGroup: HoSAntiqueWeapon
    - type: Sprite
      sprite: _DEN/Objects/Weapons/Guns/SMGs/BRDI_R25_decorated.rsi # The Den sprites
    - type: Clothing
      sprite: _DEN/Objects/Weapons/Guns/SMGs/BRDI_R25_decorated.rsi # The Den sprites
