- type: entity
  name: entity-weaponsubmachinegunfpa90-name
  parent: BaseWeaponPistol
  id: WeaponSubMachineGunFPA90
  description: entity-weaponsubmachinegunfpa90-description
  components:
  - type: Sprite
    sprite: _EE/Objects/Weapons/Guns/SMGs/FPA90.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    minAngle: 10
    maxAngle: 15
    fireRate: 20
    burstFireRate: 20
    shotsPerBurst: 3
    burstCooldown: 1.1
    selectedMode: Burst
    soundGunshot:
      path: /Audio/_EE/Weapons/Guns/Gunshots/fpa-90-suppressed-gunshot.ogg
      params:
        volume: -3
        maxDistance: 8
        rolloffFactor: 1.2
    availableModes:
      - Burst
    fireOnDropChance: 1
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineCaselessRifle
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineCaselessRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeCaselessRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeCaselessRifle
  - type: Appearance
  - type: StaticPrice
    price: 200
  - type: Item
    size: Large
    shape: null
  - type: ExtendDescription
    descriptionList:
      - description: "gun-suppressed"
        fontSize: 10
        color: "#ff4f00"
        requireDetailRange: false

- type: entity
  name: entity-weaponsubmachinegunfpa90-name
  parent: WeaponSubMachineGunFPA90
  id: WeaponSubMachineGunFPA90Empty
  description: entity-weaponsubmachinegunfpa90-description
  components:
  - type: ItemSlots
