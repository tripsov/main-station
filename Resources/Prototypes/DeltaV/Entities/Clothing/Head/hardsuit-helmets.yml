# Standard Combat Hardsuits
- type: entity
  parent: ClothingHeadHardsuitWithLightBase
  id: ClothingHeadHelmetHardsuitCombatStandard
  categories: [ HideSpawnMenu ]
  name: entity-clothingheadhelmethardsuitcombatstandard-name
  description: entity-clothingheadhelmethardsuitcombatstandard-description
  components:
  - type: Sprite
    sprite: DeltaV/Clothing/Head/Hardsuits/Combat/standard.rsi
  - type: Clothing
    sprite: DeltaV/Clothing/Head/Hardsuits/Combat/standard.rsi
  - type: PointLight
    color: "#ffeead"
  - type: PressureProtection
    highPressureMultiplier: 0.50
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.90
        Heat: 0.90

- type: entity
  parent: ClothingHeadHelmetHardsuitCombatStandard
  id: ClothingHeadHelmetHardsuitCombatOfficer
  name: entity-clothingheadhelmethardsuitcombatofficer-name
  components:
