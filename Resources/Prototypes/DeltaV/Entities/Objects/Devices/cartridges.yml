- type: entity
  parent: BaseItem
  id: CrimeAssistCartridge
  name: entity-crimeassistcartridge-name
  description: entity-crimeassistcartridge-description
  components:
  - type: Sprite
    sprite: DeltaV/Objects/Devices/cartridge.rsi
    state: cart-cri
  - type: Icon
    sprite: DeltaV/Objects/Devices/cartridge.rsi
    state: cart-cri
  - type: UIFragment
    ui: !type:CrimeAssistUi
  - type: Cartridge
    programName: crime-assist-program-name
    icon:
      sprite: DeltaV/Icons/cri.rsi
      state: cri

