- type: entity
  name: entity-foodmealscrambledeggs-name
  parent: FoodBowlBase
  id: FoodMealScrambledEggs
  description: entity-foodmealscrambledeggs-description
  components:
  - type: FlavorProfile
    flavors:
      - egg
      - salty
  - type: Sprite
    sprite: DeltaV/Objects/Consumable/Food/scrambledeggs.rsi
    layers:
      - state: bowl
      - state: scrambled-eggs
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Protein
          Quantity: 5
# Tastes like eggs, butter and salt

- type: entity
  name: entity-foodsouptomatoblue-name
  parent: FoodBowlBase
  id: FoodSoupTomatoBlue
  description: entity-foodsouptomatoblue-description
  components:
  - type: FlavorProfile
    flavors:
      - funny
      - tomato
  - type: Sprite
    sprite: DeltaV/Objects/Consumable/Food/bluepurpletomatosoup.rsi
    layers:
    - state: bowl
    - state: blue-tomato
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: SpaceLube
          Quantity: 6
        - ReagentId: Water
          Quantity: 3
  - type: Tag
    tags:
    - Fruit
    - Soup

