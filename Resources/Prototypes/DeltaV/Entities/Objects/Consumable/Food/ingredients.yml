- type: entity
  parent: ReagentPacketBase
  id: ReagentContainerSalt
  name: entity-reagentcontainersalt-name
  description: entity-reagentcontainersalt-description
  components:
  - type: Sprite
    sprite: DeltaV/Objects/Consumable/Food/ingredients.rsi
    state: salt-big
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: TableSalt
          Quantity: 50
  - type: Drink
    solution: food
    useSound:
      path: /Audio/Items/eating_1.ogg

- type: entity
