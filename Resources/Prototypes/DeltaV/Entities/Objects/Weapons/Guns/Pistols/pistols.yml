- type: entity
  name: entity-weaponpistolviperwood-name
  parent: BaseWeaponPistol
  id: WeaponPistolViperWood
  description: entity-weaponpistolviperwood-description
  suffix: Wood
  components:
  - type: Sprite
    sprite: DeltaV/Objects/Weapons/Guns/Pistols/viperwood.rsi
  - type: Clothing
    sprite: DeltaV/Objects/Weapons/Guns/Pistols/viperwood.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistol
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistol
            - MagazinePistolHighCapacity
      gun_chamber:
        name: Chamber
        startingItem: CartridgePistol
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot

- type: entity
  name: entity-weaponpistolviperwood-name
  parent: WeaponPistolViperWood
  id: WeaponPistolViperWoodSecurity
  description: entity-weaponpistolviperwood-description
               The serial number on the handguard marks this gun as belonging to an NT Security Officer.
  components:
  - type: GuideHelp
    guides: [ SecurityWeapons ]

