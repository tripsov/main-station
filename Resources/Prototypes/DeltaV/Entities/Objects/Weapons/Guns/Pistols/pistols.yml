      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot

- type: entity
  name: entity-weaponpistolflintlockcrafted-name
  suffix: "craftable"
  parent: WeaponPistolFlintlock
  id: WeaponPistolFlintlockCrafted
  description: entity-weaponpistolflintlockcrafted-description
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeMusket
    capacity: 1
    proto: null # WWDP start empty
  - type: Gun #Smoothbore
    minAngle: 0
    maxAngle: 30
    fireRate: 0.3 #slow firerate # WWDP
    # resetOnHandSelected: false #Dual Wielding Muskets # WWDP: no
  - type: Construction
    graph: WeaponFlintlocksGraph # WWDP
    node: flintlock
  - type: UseDelay
    delay: 0 #Straight up doesn't work for guns
