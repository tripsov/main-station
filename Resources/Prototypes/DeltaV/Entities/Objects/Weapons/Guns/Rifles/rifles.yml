- type: entity
  name: entity-weaponriflemusket-name
  id: WeaponRifleMusket
  parent: Musket
  suffix: "craftable"
  description: entity-weaponriflemusket-description
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeMusket
    capacity: 1
    proto: null # WWDP start empty
  - type: Sprite
    sprite: DeltaV/Objects/Weapons/Guns/Rifles/musket.rsi
    state: base
  - type: Gun #Smoothbore
    fireRate: 0.3 # WWDP
    #resetOnHandSelected: false # WWDP
    minAngle: 22
    maxAngle: 43
  - type: Wieldable
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -40
  - type: Construction
    graph: WeaponFlintlocksGraph # WWDP
    node: musket
  - type: UseDelay
    delay: 0 #Straight up doesn't work for guns
